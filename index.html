        const EyeSlash = ({size=24, className=""}) => <i className={`fas fa-eye-slash ${className}`} style={{fontSize: size}}></i>;
        const Upload = ({size=24, className=""}) => <i className={`fas fa-upload ${className}`} style={{fontSize: size}}></i>;

        // KUNCI PERBAIKAN 2: Polling yang stabil dan injeksi UMD fallback
        const getSupabase = async () => {
            if (supabase) return supabase;

            // Tahap 1: Cek apakah script di <head> berhasil dimuat
            if (window.supabase) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                return supabase;
            }

            // Tahap 2: Tunggu sebentar (maks 2.5 detik), mungkin internet melambat
            let retries = 25;
            while (!window.supabase && retries > 0) {
                await new Promise(resolve => setTimeout(resolve, 100));
                retries--;
            }

            if (window.supabase) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                return supabase;
            }

            // Tahap 3: Darurat. Multi-CDN Fallback (Jika 1 diblokir, coba yang lain)
            const cdnList = [
                'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/supabase/2.39.3/supabase.umd.min.js', // CDN Cloudflare (Paling kebal blokir)
                'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js'
            ];

            for (const cdnUrl of cdnList) {
                try {
                    await new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = cdnUrl;
                        script.crossOrigin = 'anonymous';
                        
                        script.onload = () => {
                            if (window.supabase) resolve();
                            else reject(new Error("Dimuat tapi window.supabase kosong."));
                        };
                        
                        script.onerror = () => reject(new Error(`Gagal memuat ${cdnUrl}`));
                        document.head.appendChild(script);
                    });
                    
                    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    return supabase;
                } catch (e) {
                    console.warn(`Fallback CDN Gagal: ${e.message}. Mencoba jalur lain...`);
                    // Lanjut ke CDN berikutnya dalam daftar
                }
            }
            
            // Jika semua CDN gagal, baru lemparkan error fatal
            throw new Error("Semua jalur CDN diblokir oleh jaringan atau browser Anda. Gunakan Live Server (Bukan file:///) atau ganti koneksi internet.");
        };

        const RichTextEditor = ({ value, onChange, placeholder, minHeight="120px" }) => {
            const editorRef = useRef(null);
            const fileInputRef = useRef(null);

            useEffect(() => {
                if (editorRef.current && value !== editorRef.current.innerHTML) editorRef.current.innerHTML = value || '';
                try {
                    document.execCommand('defaultParagraphSeparator', false, 'p');
                    document.execCommand('styleWithCSS', false, true);
                } catch(e) {}
            }, []); 

            const handleInput = () => { if (editorRef.current) onChange(editorRef.current.innerHTML); };
            
            const execCmd = (cmd, e, val=null) => { 
                if(e) e.preventDefault(); 
                editorRef.current.focus(); 
                document.execCommand(cmd, false, val); 
                handleInput(); 
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const imgHTML = `<img src="${reader.result}" alt="Gambar" style="max-width: 100%; width: auto; max-height: 250px; border-radius: 8px; margin: 8px 0; object-fit: contain; display: block;" /><br/>`;
                        editorRef.current.focus();
                        document.execCommand('insertHTML', false, imgHTML);
                        handleInput();
                    };
                    reader.readAsDataURL(file);
                }
            };

            const insertMath = (formula) => {
                const mathHTML = ` <span class="math-tex">\\(${formula}\\)</span> `;
                editorRef.current.focus();
                document.execCommand('insertHTML', false, mathHTML);
                handleInput();
            };

            const insertMathManual = (e) => {
                if(e) e.preventDefault();
                const formula = prompt("Ketik manual kode LaTeX (contoh: \\frac{1}{2}):");
                if (formula) insertMath(formula);
            };

            return (
                <div className="border border-slate-300 rounded-lg overflow-hidden bg-white focus-within:border-emerald-500 focus-within:ring-1 transition-all">
                    <div className="bg-slate-50 border-b border-slate-200 p-1.5 flex flex-wrap gap-1 items-center">
                        <button onMouseDown={(e)=>execCmd('bold', e)} type="button" className="w-8 h-8 font-bold text-slate-700 hover:bg-slate-200 rounded">B</button>
                        <button onMouseDown={(e)=>execCmd('italic', e)} type="button" className="w-8 h-8 italic text-slate-700 hover:bg-slate-200 rounded">I</button>
                        <button onMouseDown={(e)=>execCmd('underline', e)} type="button" className="w-8 h-8 underline text-slate-700 hover:bg-slate-200 rounded">U</button>
                        
                        <div className="w-px h-5 bg-slate-300 mx-1"></div>
                        <button onMouseDown={(e)=>execCmd('justifyLeft', e)} type="button" className="w-8 h-8 text-slate-700 hover:bg-slate-200 rounded flex items-center justify-center" title="Rata Kiri"><i className="fas fa-align-left text-xs"></i></button>
                        <button onMouseDown={(e)=>execCmd('justifyCenter', e)} type="button" className="w-8 h-8 text-slate-700 hover:bg-slate-200 rounded flex items-center justify-center" title="Rata Tengah"><i className="fas fa-align-center text-xs"></i></button>
                        <button onMouseDown={(e)=>execCmd('justifyRight', e)} type="button" className="w-8 h-8 text-slate-700 hover:bg-slate-200 rounded flex items-center justify-center" title="Rata Kanan"><i className="fas fa-align-right text-xs"></i></button>
                        <button onMouseDown={(e)=>execCmd('justifyFull', e)} type="button" className="w-8 h-8 text-slate-700 hover:bg-slate-200 rounded flex items-center justify-center" title="Rata Kanan Kiri (Justify)"><i className="fas fa-align-justify text-xs"></i></button>

                        <div className="w-px h-5 bg-slate-300 mx-1"></div>
                        <button onMouseDown={(e)=>{ if(e) e.preventDefault(); fileInputRef.current.click();}} type="button" className="h-8 px-2.5 text-slate-700 hover:bg-slate-200 rounded flex items-center text-xs font-semibold"><ImageIcon size={14} className="mr-1 text-emerald-600"/> Gambar</button>
                        
                        <div className="w-px h-5 bg-slate-300 mx-1"></div>
                        <button onMouseDown={insertMathManual} type="button" className="h-8 px-2 text-slate-700 hover:bg-slate-200 rounded flex items-center text-xs font-semibold" title="Ketik Manual LaTeX"><Calculator size={14} className="mr-1 text-blue-600"/> Manual</button>
                        
                        <select 
                            onChange={(e) => { 
                                if(e.target.value) { 
                                    insertMath(e.target.value); 
                                    e.target.value = ''; 
                                } 
                            }} 
                            className="h-8 px-2 ml-1 bg-white hover:bg-slate-50 border border-slate-300 rounded text-xs font-bold text-blue-700 outline-none cursor-pointer focus:ring-1 focus:ring-blue-500 shadow-sm"
                        >
                            <option value="">+ Sisipkan Rumus</option>
                            <option value={"x^2"}>Kuadrat (x²)</option>
                            <option value={"\\sqrt{x}"}>Akar (√x)</option>
                            <option value={"\\sqrt[n]{x}"}>Akar Pangkat (ⁿ√x)</option>
                            <option value={"\\pi"}>Phi (π)</option>
                            <option value={"\\frac{x}{y}"}>Pecahan (x/y)</option>
                            <option value={"x"}>Tanda (x)</option>
                            <option value={"n"}>Tanda (n)</option>
                            <option value={"\\times"}>Kali (×)</option>
                            <option value={"\\div"}>Bagi (÷)</option>
                            <option value={"\\frac{a}{b} + \\frac{c}{d}"}>Jumlah Pecahan</option>
                        </select>

                        <input type="file" ref={fileInputRef} onChange={handleImageUpload} accept="image/*" className="hidden" />
                    </div>
                    <div ref={editorRef} contentEditable onInput={handleInput} onBlur={handleInput} className="p-3 outline-none rich-text-content editor-ignore-math text-slate-700 text-sm" style={{minHeight: minHeight}} placeholder={placeholder} />
                </div>
            );
        };

        function useStickySession(defaultValue, key) {
          const [value, setValue] = useState(() => {
            const stickyValue = window.localStorage.getItem(key);
            return stickyValue !== null ? JSON.parse(stickyValue) : defaultValue;
          });
          useEffect(() => { window.localStorage.setItem(key, JSON.stringify(value)); }, [key, value]);
          return [value, setValue];
        }

        const triggerMathRender = () => {
            if (window.renderMathInElement) {
                setTimeout(() => {
                    window.renderMathInElement(document.body, {
                        ignoredClasses: ["editor-ignore-math"],
                        delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}, {left: '\\[', right: '\\]', display: true}],
                        throwOnError : false
                    });
                }, 300);
            }
        };

        const calculateScore = (answers, questions) => {
          let totalPoints = 0;
          let maxPoints = 0;
          
          const detailedResults = questions.map(q => {
            const userAnswer = answers[q.id];
            let pointsEarned = 0;
            let questionMaxPoints = 0;
            let isCorrect = false;
            
            if (q.type === 'MCQ') {
                questionMaxPoints = 1;
                if (userAnswer && userAnswer === q.correctAnswer) {
                    pointsEarned = 1;
                    isCorrect = true;
                }
            } else if (q.type === 'MCMA') {
                questionMaxPoints = 2;
                if (userAnswer && Array.isArray(userAnswer)) {
                    const sortedUser = [...userAnswer].sort();
                    const sortedCorrect = [...(q.correctAnswers || [])].sort();
                    if (sortedUser.length === sortedCorrect.length && sortedUser.every((val, index) => val === sortedCorrect[index])) {
                        pointsEarned = 2;
                        isCorrect = true;
                    }
                }
            } else if (q.type === 'CATEGORY') {
                const statementsCount = (q.statements || []).length;
                questionMaxPoints = statementsCount; 
                
                if (userAnswer) {
                    let correctCount = 0;
                    (q.statements || []).forEach(s => {
                        if (userAnswer[s.id] === s.correctCategory) correctCount++;
                    });
                    pointsEarned = correctCount;
                    isCorrect = correctCount === statementsCount;
                }
            }
            
            maxPoints += questionMaxPoints;
            totalPoints += pointsEarned;
            
            const isEmpty = !userAnswer || (typeof userAnswer === 'object' && Object.keys(userAnswer).length === 0);
            
            return { 
                qId: q.id, 
                type: q.type, 
                isCorrect, 
                isEmpty,
                pointsEarned,
                questionMaxPoints,
                userAnswer: userAnswer 
            };
          });
          
          let rawPercentage = maxPoints > 0 ? (totalPoints / maxPoints) * 100 : 0;
          const finalScore = Math.min(100, Math.round(rawPercentage));
          
          return { finalScore, totalPoints, maxPoints, detailedResults };
        };

        function App() {
          const [currentRoute, setCurrentRoute] = useState('/'); 
          const [tokens, setTokens] = useState([]);
          const [results, setResults] = useState([]);
          const [questions, setQuestions] = useState([]);
          
          const [activeFolder, setActiveFolder] = useState('Utama');
          const [organizerName, setOrganizerName] = useState('KKGK Relasi Wonosobo');
          const [schoolLogo, setSchoolLogo] = useState('');
          const [examDate, setExamDate] = useState('');
          const [startTimeStr, setStartTimeStr] = useState('07:30');
          const [endTimeStr, setEndTimeStr] = useState('12:00');
          const [isRandomQ, setIsRandomQ] = useState(false);
          const [isRandomOpt, setIsRandomOpt] = useState(false);

          const [isLoadingData, setIsLoadingData] = useState(false);
          const [dbStatus, setDbStatus] = useState('connecting');
          const [initErrorMsg, setInitErrorMsg] = useState('');
          
          const [activeSession, setActiveSession] = useStickySession(null, 'cbt_active_session');
          const [isAdminLoggedIn, setIsAdminLoggedIn] = useStickySession(false, 'cbt_admin_auth');

          const navigate = (path) => { window.scrollTo(0,0); setCurrentRoute(path); };

          const fetchSupabaseData = async () => {
             setIsLoadingData(true);
             try {
                const db = await getSupabase();
                const [qRes, tRes] = await Promise.all([
                    db.from('questions').select('*'),
                    db.from('tokens').select('*').order('generatedAt', { ascending: false })
                ]);
                
                if(qRes.error) throw qRes.error;
                if(tRes.error) throw tRes.error;
                
                if(qRes.data) setQuestions(qRes.data);
                if(tRes.data) {
                    setTokens(tRes.data);
                    
                    const fToken = tRes.data.find(t => t.code === 'SYS_SETTING_FOLDER');
                    if (fToken) setActiveFolder(fToken.status);

                    const oToken = tRes.data.find(t => t.code === 'SYS_SETTING_ORGANIZER');
                    if (oToken) setOrganizerName(oToken.status);

                    const lToken = tRes.data.find(t => t.code === 'SYS_SETTING_LOGO');
                    if (lToken) setSchoolLogo(lToken.status);

                    const dtToken = tRes.data.find(t => t.code === 'SYS_SETTING_DATE');
                    if (dtToken) setExamDate(dtToken.status);

                    const stToken = tRes.data.find(t => t.code === 'SYS_SETTING_START_TIME');
                    if (stToken) setStartTimeStr(stToken.status);

                    const etToken = tRes.data.find(t => t.code === 'SYS_SETTING_END_TIME');
                    if (etToken) setEndTimeStr(etToken.status);

                    const rqToken = tRes.data.find(t => t.code === 'SYS_SETTING_RANDOM_Q');
                    if (rqToken) setIsRandomQ(rqToken.status === 'TRUE');

                    const roToken = tRes.data.find(t => t.code === 'SYS_SETTING_RANDOM_OPT');
                    if (roToken) setIsRandomOpt(roToken.status === 'TRUE');
                }

                if (isAdminLoggedIn) {
                   const rRes = await db.from('results').select('*').order('created_at', { ascending: false });
                   if(rRes.error) throw rRes.error;
                   if(rRes.data) {
                      const formattedResults = rRes.data.map(r => ({
                         id: r.id,
                         participant: { name: r.participant_name, school: r.participant_school, nis: r.participant_nis, grade: r.participant_grade },
                         token: r.token, score: r.score, startTime: parseInt(r.start_time), endTime: parseInt(r.end_time),
                         detail: { detailedResults: typeof r.detailed_results === 'string' ? JSON.parse(r.detailed_results) : r.detailed_results }, created_at: r.created_at
                      }));
                      setResults(formattedResults);
                   }
                }
                setDbStatus('connected');
                setInitErrorMsg('');
             } catch (error) {
                console.error("Fetch error:", error);
                setInitErrorMsg(error.message);
                setDbStatus('error');
             } finally {
                setIsLoadingData(false);
             }
          };

          useEffect(() => { fetchSupabaseData(); }, [isAdminLoggedIn]);

          const activeQuestions = isAdminLoggedIn ? questions : questions.filter(q => String(q.folder || 'Utama').trim().toLowerCase() === String(activeFolder || 'Utama').trim().toLowerCase());

          useEffect(() => {
            if (currentRoute === '/') {
              if (activeSession && activeSession.status === 'ACTIVE') navigate('/exam');
              else navigate('/login');
            }
            triggerMathRender();
          }, [currentRoute, activeSession]);

          const ParticipantLogin = () => {
            const [inputToken, setInputToken] = useState('');
            const [error, setError] = useState('');
            const [isChecking, setIsChecking] = useState(false);

            const handleLogin = async (e) => {
              e.preventDefault();
              setIsChecking(true); setError('');
              try {
                const db = await getSupabase();
                const { data: tokenObj, error: fetchErr } = await db.from('tokens').select('*').eq('code', inputToken.trim().toUpperCase()).single();
                
                if (fetchErr || !tokenObj || tokenObj.code.startsWith('SYS_SETTING_') || tokenObj.code.startsWith('SYS_FOLDER_')) { setError('Token tidak valid atau tidak ditemukan.'); setIsChecking(false); return; }
                if (tokenObj.status === 'USED') { setError('Token sudah digunakan.'); setIsChecking(false); return; }
                if (tokenObj.status === 'EXPIRED') { setError('Token kedaluwarsa.'); setIsChecking(false); return; }
                if (tokenObj.status === 'BLOCKED') { setError('Token diblokir. Hubungi administrator.'); setIsChecking(false); return; }

                if (examDate && startTimeStr && endTimeStr) {
                    const now = new Date();
                    const startDateTime = new Date(`${examDate}T${startTimeStr}:00`);
                    const endDateTime = new Date(`${examDate}T${endTimeStr}:00`);
                    if (now < startDateTime) {
                        setError(`Ujian belum dimulai. Jadwal: ${examDate} pukul ${startTimeStr}`);
                        setIsChecking(false); return;
                    }
                    if (now > endDateTime) {
                        setError(`Waktu ujian telah berakhir pada ${examDate} pukul ${endTimeStr}`);
                        setIsChecking(false); return;
                    }
                }

                setActiveSession({ 
                    token: tokenObj.code, 
                    participant: { name: tokenObj.participant_name || 'Peserta', school: tokenObj.participant_school || organizerName, nis: '', grade: '6' }, 
                    answers: {}, flagged: [], status: 'SETUP' 
                });
                navigate('/instruction');
              } catch (err) { setError(err.message || 'Gagal terhubung ke server.'); }
              setIsChecking(false);
            };

            return (
              <div className="min-h-screen bg-slate-50 flex flex-col justify-center items-center p-4">
                <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border-t-4 border-blue-600">
                  <div className="text-center mb-8">
                    <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm overflow-hidden">
                        {schoolLogo ? <img src={schoolLogo} alt="Logo" className="w-full h-full object-cover"/> : <Monitor size={32} />}
                    </div>
                    <h1 className="text-2xl font-black text-slate-800 tracking-tight">CBT TKA</h1>
                    <p className="text-slate-500 font-medium mt-1">{organizerName}</p>
                  </div>
                  
                  {initErrorMsg && (
                      <div className="mb-6 p-4 bg-red-50 text-red-600 rounded-xl text-sm border border-red-200 font-medium flex items-start">
                          <AlertCircle size={18} className="mr-2 mt-0.5 flex-shrink-0"/>
                          <div><p className="font-bold mb-1">Gagal Terhubung ke Database</p><p>{initErrorMsg}</p></div>
                      </div>
                  )}

                  <form onSubmit={handleLogin} className="space-y-5">
                    <div>
                      <label className="block text-sm font-bold text-slate-700 mb-2">Masukkan Token Ujian</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><Key className="h-5 w-5 text-slate-400" /></div>
                        <input type="text" className="block w-full pl-11 pr-4 py-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 uppercase tracking-widest font-bold text-slate-800 placeholder-slate-300 bg-slate-50 focus:bg-white" placeholder="Ketik Token..." value={inputToken} onChange={(e) => setInputToken(e.target.value.toUpperCase())} required disabled={isChecking || dbStatus === 'error'}/>
                      </div>
                      {error && <p className="mt-2 text-sm text-rose-500 font-medium flex items-center"><AlertCircle size={14} className="mr-1.5"/> {error}</p>}
                    </div>
                    <button type="submit" disabled={isChecking || dbStatus === 'error'} className="w-full flex justify-center py-3.5 px-4 rounded-xl text-base font-bold text-white bg-blue-600 hover:bg-blue-700 transition-all shadow-md disabled:opacity-50">
                      {isChecking ? 'Memeriksa Token...' : 'Masuk Ujian'}
                    </button>
                  </form>
                  <div className="mt-8 pt-6 border-t border-slate-100 flex justify-between items-center">
                     <span className={`text-xs font-bold px-3 py-1.5 rounded-md flex items-center ${dbStatus === 'connected' ? 'bg-emerald-50 text-emerald-600 border border-emerald-100' : 'bg-rose-50 text-rose-600 border border-rose-100'}`}>
                         <Cloud size={14} className="mr-1.5"/> {dbStatus === 'connected' ? 'On-line' : 'Offline'}
                     </span>
                     <button onClick={() => navigate('/admin/login')} className="text-xs font-semibold text-slate-400 hover:text-slate-800 transition-colors flex items-center"><Settings size={14} className="mr-1"/> Admin</button>
                  </div>
                </div>
              </div>
            );
          };

          const ParticipantInstruction = () => {
            const [isStarting, setIsStarting] = useState(false);
            if (!activeSession || !activeSession.participant) { navigate('/login'); return null; }
            
            const startExam = async () => {
              setIsStarting(true);
              try {
                const db = await getSupabase();
                await db.from('tokens').update({ status: 'USED' }).eq('code', activeSession.token);

                let sessionQuestions = JSON.parse(JSON.stringify(activeQuestions));
                if (isRandomQ) {
                    for (let i = sessionQuestions.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [sessionQuestions[i], sessionQuestions[j]] = [sessionQuestions[j], sessionQuestions[i]];
                    }
                }
                if (isRandomOpt) {
                    sessionQuestions = sessionQuestions.map(q => {
                        if (q.type === 'MCQ' && q.options) {
                            const originalOptions = [...q.options];
                            const texts = originalOptions.map(o => o.text);
                            for (let i = texts.length - 1; i > 0; i--) {
                                const j = Math.floor(Math.random() * (i + 1));
                                [texts[i], texts[j]] = [texts[j], texts[i]];
                            }
                            q.options = originalOptions.map((opt, idx) => ({ ...opt, text: texts[idx] }));
                            const originalCorrectText = originalOptions.find(o => o.id === q.correctAnswer)?.text;
                            const newCorrectOption = q.options.find(o => o.text === originalCorrectText);
                            if (newCorrectOption) q.correctAnswer = newCorrectOption.id;
                        }
                        return q;
                    });
                }

                let durationLimitMs = 60 * 60 * 1000;
                if (examDate && endTimeStr) {
                    const endDateTime = new Date(`${examDate}T${endTimeStr}:00`).getTime();
                    durationLimitMs = Math.max(60000, endDateTime - new Date().getTime());
                }

                setActiveSession(prev => ({ 
                    ...prev, 
                    status: 'ACTIVE', 
                    startTime: new Date().getTime(), 
                    durationLimit: durationLimitMs, 
                    sessionQuestions,
                    examCurrentIndex: 0 
                }));
                navigate('/exam');
              } catch (err) { 
                 alert("Gagal memulai ujian: " + err.message); 
                 setIsStarting(false); 
              }
            };

            return (
              <div className="min-h-screen bg-slate-50 py-10 px-4 flex justify-center items-center">
                 <div className="max-w-3xl w-full bg-white rounded-2xl shadow-xl p-8 md:p-10 border-t-4 border-amber-500">
                    <div className="flex items-center mb-6 pb-4 border-b border-slate-100">
                       <FileText className="text-amber-500 mr-3" size={28} />
                       <h2 className="text-2xl font-bold text-slate-800">Petunjuk Ujian</h2>
                    </div>
                    <div className="prose prose-slate max-w-none mb-8">
                       <ul className="space-y-4 text-slate-700 font-medium">
                         <li className="flex items-start"><CheckCircle className="text-emerald-500 mr-3 mt-1 flex-shrink-0" size={18}/> Waktu pengerjaan disesuaikan hingga jam selesai untuk <b>{activeQuestions.length} soal</b>.</li>
                         <li className="flex items-start"><CheckCircle className="text-emerald-500 mr-3 mt-1 flex-shrink-0" size={18}/> Jawaban akan <b>tersimpan otomatis</b> setiap Anda berpindah nomor.</li>
                         <li className="flex items-start text-red-600 font-medium bg-red-50 p-4 rounded-lg border border-red-100"><AlertCircle className="text-red-500 mr-3 mt-0.5 flex-shrink-0" size={18}/> Dilarang keras membuka tab/jendela lain. Sistem akan mencatat setiap pelanggaran yang terjadi.</li>
                       </ul>
                    </div>
                    <div className="bg-blue-50 p-5 rounded-xl flex flex-col sm:flex-row items-center justify-between gap-4 border border-blue-100">
                       <div className="text-blue-900 text-center sm:text-left">
                         Peserta: <strong className="text-lg block sm:inline">{activeSession.participant.name}</strong> <br className="sm:hidden"/>({activeSession.participant.school})
                       </div>
                       <button onClick={startExam} disabled={isStarting || activeQuestions.length === 0} className="w-full sm:w-auto py-3.5 px-8 bg-emerald-600 text-white font-bold text-lg rounded-xl shadow-md hover:bg-emerald-700 transition-transform hover:scale-105 disabled:opacity-50">
                           {isStarting ? 'Memproses...' : 'Mulai Ujian'}
                       </button>
                    </div>
                 </div>
              </div>
            );
          };

          const ExamEngine = () => {
            const [timeLeft, setTimeLeft] = useState(0);
            
            useEffect(() => {
                if (!activeSession || activeSession.status !== 'ACTIVE') return;
                const preventDefaultAction = (e) => e.preventDefault();
                const handleVisibilityChange = () => {
                    if (document.hidden) {
                        alert("PERINGATAN PELANGGARAN!\nAnda terdeteksi keluar dari layar ujian.");
                        setActiveSession(prev => ({ ...prev, cheatWarnings: (prev.cheatWarnings || 0) + 1 }));
                    }
                };
                document.addEventListener('contextmenu', preventDefaultAction);
                document.addEventListener('copy', preventDefaultAction);
                document.addEventListener('visibilitychange', handleVisibilityChange);
                return () => {
                    document.removeEventListener('contextmenu', preventDefaultAction);
                    document.removeEventListener('copy', preventDefaultAction);
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                };
            }, [activeSession?.status]);

            const examCurrentIndex = activeSession?.examCurrentIndex || 0;
            const setExamCurrentIndex = (idx) => setActiveSession(prev => ({ ...prev, examCurrentIndex: idx }));
            
            useEffect(() => { 
                if (!activeSession || activeSession.status !== 'ACTIVE') navigate('/'); 
                triggerMathRender(); 
            }, [activeSession?.status, examCurrentIndex]);

            useEffect(() => {
              if (!activeSession || activeSession.status !== 'ACTIVE') return;
              const timer = setInterval(() => {
                const now = new Date().getTime();
                const remaining = Math.max(0, Math.floor(((activeSession.startTime + activeSession.durationLimit) - now) / 1000));
                setTimeLeft(remaining);
                if (remaining <= 0) { clearInterval(timer); navigate('/review'); } 
              }, 1000);
              return () => clearInterval(timer);
            }, [activeSession]);

            const examQuestions = activeSession?.sessionQuestions || activeQuestions;
            if (!activeSession || examQuestions.length === 0 || !examQuestions[examCurrentIndex]) return <div className="min-h-screen flex items-center justify-center font-medium text-slate-500">Memuat soal...</div>;
            
            const currentQuestion = examQuestions[examCurrentIndex];
            const currentAnswer = activeSession.answers[currentQuestion.id];
            const isFlagged = activeSession.flagged?.includes(currentQuestion.id);
            
            const handleAnswerChange = (val) => { setActiveSession(prev => ({ ...prev, answers: { ...prev.answers, [currentQuestion.id]: val } })); };
            const toggleFlag = () => { setActiveSession(prev => ({ ...prev, flagged: isFlagged ? prev.flagged.filter(id => id !== currentQuestion.id) : [...(prev.flagged || []), currentQuestion.id] })); };

            const handleAnswerChangeMCQ = (val) => {
                handleAnswerChange(val);
                if (examCurrentIndex < examQuestions.length - 1) {
                    setTimeout(() => setExamCurrentIndex(examCurrentIndex + 1), 400); 
                }
            };

            const RenderMCQ = () => (
              <div className="space-y-3 mt-6">
                {(currentQuestion.options||[]).map(opt => (
                  <label key={opt.id} className={`flex items-start p-4 border rounded-xl cursor-pointer transition-all ${currentAnswer === opt.id ? 'border-emerald-500 bg-emerald-50 shadow-sm' : 'border-slate-200 hover:bg-slate-50'}`}>
                    <div className="flex items-center h-6 mt-0.5"><input type="radio" checked={currentAnswer === opt.id} onChange={() => handleAnswerChangeMCQ(opt.id)} className="w-5 h-5 text-emerald-600" /></div>
                    <div className="ml-4 flex-1 flex text-slate-800"><span className="font-bold text-slate-400 w-6 mt-0.5">{opt.id}.</span><div className="flex-1 rich-text-content" dangerouslySetInnerHTML={{__html: opt.text}}></div></div>
                  </label>
                ))}
              </div>
            );

            const RenderMCMA = () => {
               const selectedArr = Array.isArray(currentAnswer) ? currentAnswer : [];
               const handleToggle = (id) => {
                  let newArr = [...selectedArr];
                  if(newArr.includes(id)) newArr = newArr.filter(x => x !== id); else newArr.push(id);
                  handleAnswerChange(newArr.length > 0 ? newArr : null);
               };
               return (
                  <div className="space-y-3 mt-6">
                     <div className="bg-blue-50 border border-blue-100 text-blue-700 p-3 rounded-lg font-medium text-sm mb-4 flex items-center"><AlertCircle size={16} className="mr-2"/> Pilih lebih dari satu jawaban.</div>
                     {(currentQuestion.statements||[]).map((stmt, idx) => (
                        <label key={stmt.id} className={`flex items-start p-4 border rounded-xl cursor-pointer transition-all ${selectedArr.includes(stmt.id) ? 'border-blue-500 bg-blue-50 shadow-sm' : 'border-slate-200 hover:bg-slate-50'}`}>
                           <div className="flex items-center h-6 mt-0.5"><input type="checkbox" checked={selectedArr.includes(stmt.id)} onChange={() => handleToggle(stmt.id)} className="w-5 h-5 text-blue-600 rounded" /></div>
                           <div className="ml-4 flex-1 flex text-slate-800"><span className="font-bold text-slate-400 w-6 mt-0.5">{idx + 1}.</span><div className="flex-1 rich-text-content" dangerouslySetInnerHTML={{__html: stmt.text}}></div></div>
                        </label>
                     ))}
                  </div>
               );
            };

            const RenderCATEGORY = () => {
               const catAnswer = currentAnswer || {};
               const cat1Label = currentQuestion.statements?.[0]?.category1 || 'Benar';
               const cat2Label = currentQuestion.statements?.[0]?.category2 || 'Salah';
               return (
                  <div className="mt-6 overflow-x-auto pb-2">
                     <table className="w-full text-left border-collapse min-w-[500px] bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <thead><tr className="bg-slate-50 border-b"><th className="py-3 px-4 text-center w-12">No</th><th className="py-3 px-4">Pernyataan</th><th className="py-3 px-4 text-center w-28 bg-emerald-50/50 border-l">{cat1Label}</th><th className="py-3 px-4 text-center w-28 bg-amber-50/50 border-l">{cat2Label}</th></tr></thead>
                        <tbody>
                           {(currentQuestion.statements||[]).map((stmt, idx) => (
                              <tr key={stmt.id} className="border-b border-slate-100 hover:bg-slate-50">
                                 <td className="py-4 px-4 text-slate-400 font-medium text-center align-top">{idx + 1}</td>
                                 <td className="py-4 px-4 text-slate-800 align-top"><div className="rich-text-content text-sm" dangerouslySetInnerHTML={{__html: stmt.text}}></div></td>
                                 <td className="py-4 px-4 text-center align-middle border-l bg-emerald-50/30 cursor-pointer" onClick={() => handleAnswerChange({...catAnswer, [stmt.id]: cat1Label})}><input type="radio" checked={catAnswer[stmt.id] === cat1Label} onChange={() => {}} className="w-5 h-5 text-emerald-600" /></td>
                                 <td className="py-4 px-4 text-center align-middle border-l bg-amber-50/30 cursor-pointer" onClick={() => handleAnswerChange({...catAnswer, [stmt.id]: cat2Label})}><input type="radio" checked={catAnswer[stmt.id] === cat2Label} onChange={() => {}} className="w-5 h-5 text-amber-600" /></td>
                              </tr>
                           ))}
                        </tbody>
                     </table>
                  </div>
               );
            };

            const fmtTime = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;

            return (
              <div className="min-h-screen bg-slate-50 flex flex-col prevent-select">
                <header className="bg-slate-900 shadow px-4 sm:px-6 py-3 flex justify-between items-center sticky top-0 z-20">
                   <div className="flex items-center">
                      <div className="hidden sm:flex w-9 h-9 bg-emerald-500 rounded-lg items-center justify-center text-white mr-3"><Monitor size={18}/></div>
                      <div><h1 className="text-base font-bold text-white leading-tight">CBT Ujian Terpadu</h1><p className="text-xs text-slate-400">{activeSession.participant?.name}</p></div>
                   </div>
                   <div className={`flex items-center font-bold text-lg px-4 py-1.5 rounded-lg border ${timeLeft < 300 ? 'bg-red-500 text-white animate-pulse' : 'bg-slate-800 text-emerald-400'}`}>
                      <Clock size={18} className="mr-2" /> {fmtTime(timeLeft)}
                   </div>
                </header>
                <div className="flex-1 flex flex-col lg:flex-row max-w-[1400px] w-full mx-auto p-4 gap-5">
                   <div className="flex-1 flex flex-col min-w-0">
                      <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 sm:p-8 flex-1 flex flex-col">
                         <div className="flex flex-wrap gap-2 justify-between items-center mb-6 pb-4 border-b">
                            <h2 className="text-xl font-bold text-slate-800">SOAL NO. {examCurrentIndex + 1}</h2>
                            <span className="text-xs font-semibold px-2.5 py-1 rounded-md bg-slate-100 text-slate-600">{currentQuestion.category}</span>
                         </div>
                         <div className="flex-1 overflow-y-auto pr-1 pb-8">
                            <div className="text-base sm:text-lg text-slate-800 leading-relaxed font-medium mb-6 rich-text-content" dangerouslySetInnerHTML={{ __html: currentQuestion.question || '' }} />
                            {currentQuestion.type === 'MCQ' && <RenderMCQ />}
                            {currentQuestion.type === 'MCMA' && <RenderMCMA />}
                            {currentQuestion.type === 'CATEGORY' && <RenderCATEGORY />}
                         </div>
                         <div className="pt-5 mt-4 border-t flex justify-between items-center gap-3">
                            <button onClick={() => setExamCurrentIndex(Math.max(0, examCurrentIndex - 1))} disabled={examCurrentIndex === 0} className="px-4 py-2.5 bg-slate-50 text-slate-700 rounded-lg disabled:opacity-50 font-medium border"><ChevronLeft size={18} className="mr-1" /> Sebelum</button>
                            <label className={`flex items-center px-4 py-2.5 rounded-lg font-medium border cursor-pointer ${isFlagged ? 'bg-amber-50 border-amber-300 text-amber-700' : 'bg-white border-slate-200 text-slate-600'}`}>
                               <input type="checkbox" checked={isFlagged} onChange={toggleFlag} className="mr-2 w-4 h-4 text-amber-500 rounded" /> Ragu-ragu
                            </label>
                            {examCurrentIndex < examQuestions.length - 1 ? (
                               <button onClick={() => setExamCurrentIndex(examCurrentIndex + 1)} className="px-5 py-2.5 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 shadow-sm">Lanjut</button>
                            ) : (
                               <button onClick={() => navigate('/review')} className="px-5 py-2.5 bg-emerald-600 text-white font-semibold rounded-lg hover:bg-emerald-700 shadow-sm">Selesai</button>
                            )}
                         </div>
                      </div>
                   </div>
                   <div className="lg:w-80 w-full flex-shrink-0">
                      <div className="bg-white rounded-xl shadow-sm border p-5 sticky top-20">
                         <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center border-b pb-3"><LayoutDashboard size={18} className="mr-2 text-slate-400"/> Navigator Soal</h3>
                         <div className="grid grid-cols-5 gap-2 max-h-[50vh] overflow-y-auto">
                            {examQuestions.map((q, idx) => {
                               const ans = activeSession.answers[q.id];
                               const isAns = ans && (q.type !== 'CATEGORY' || Object.keys(ans).length === (q.statements||[]).length);
                               const isCur = idx === examCurrentIndex;
                               const isFlg = activeSession.flagged?.includes(q.id);
                               let cls = "h-10 w-full rounded-lg font-semibold text-sm flex items-center justify-center border transition-all cursor-pointer ";
                               if (isCur) cls += "ring-2 ring-blue-500 bg-white text-slate-800 border-slate-300";
                               else if (isFlg) cls += "bg-amber-400 text-amber-900 border-amber-500";
                               else if (isAns) cls += "bg-emerald-500 text-white border-emerald-600";
                               else cls += "bg-slate-50 text-slate-500 border-slate-200";
                               return <button key={q.id} onClick={() => setExamCurrentIndex(idx)} className={cls}>{idx + 1}</button>;
                            })}
                         </div>
                      </div>
                   </div>
                </div>
              </div>
            );
          };

          const ExamReview = () => {
             const [isSubmitting, setIsSubmitting] = useState(false);
             const [showConfirm, setShowConfirm] = useState(false);
             if (!activeSession || activeSession.status !== 'ACTIVE') { navigate('/'); return null; }

             const examQuestions = activeSession?.sessionQuestions || activeQuestions;
             const totalQ = examQuestions.length;
             const ansQ = examQuestions.filter(q => {
                const ans = activeSession.answers[q.id];
                if(!ans) return false;
                if(q.type === 'CATEGORY') return Object.keys(ans).length === (q.statements||[]).length;
                return true;
             }).length;

             const handleFinalSubmit = async () => {
               setIsSubmitting(true);
               const result = calculateScore(activeSession.answers, examQuestions);
               const finalDetailedResults = [...result.detailedResults, { qId: 'SYS_CHEATS', cheatCount: activeSession.cheatWarnings || 0 }];
               const payload = {
                  participant_name: activeSession.participant.name, participant_school: activeSession.participant.school,
                  participant_nis: activeSession.participant.nis, participant_grade: activeSession.participant.grade,
                  token: activeSession.token, score: result.finalScore, start_time: activeSession.startTime,
                  end_time: new Date().getTime(), detailed_results: JSON.stringify(finalDetailedResults)
               };
               try {
                 const db = await getSupabase();
                 await db.from('results').insert([payload]);
                 setActiveSession({ ...activeSession, status: 'SUBMITTED', score: result.finalScore });
                 navigate('/submitted');
               } catch (err) {
                 alert("Gagal mengirim ujian: " + err.message);
                 setIsSubmitting(false); setShowConfirm(false);
               }
             };

             return (
               <div className="min-h-screen bg-slate-50 flex py-10 px-4 justify-center items-center">
                   <div className="bg-white p-8 md:p-10 rounded-2xl shadow-xl max-w-2xl w-full text-center border-t-4 border-blue-600">
                      <h2 className="text-2xl font-bold mb-6 text-slate-800">Konfirmasi Selesai Ujian</h2>
                      <div className="grid grid-cols-2 gap-4 mb-8">
                         <div className="p-5 bg-slate-50 border rounded-xl"><p className="text-slate-500 text-sm mb-1">Total Soal</p><p className="text-4xl font-bold text-slate-800">{totalQ}</p></div>
                         <div className="p-5 bg-emerald-50 border rounded-xl"><p className="text-emerald-700 text-sm mb-1">Dijawab</p><p className="text-4xl font-bold text-emerald-600">{ansQ}</p></div>
                      </div>
                      {!showConfirm ? (
                         <div className="flex gap-3">
                            <button onClick={()=>navigate('/exam')} className="flex-1 py-3 border rounded-xl font-semibold text-slate-700">Kembali</button>
                            <button onClick={()=>setShowConfirm(true)} className="flex-1 py-3 bg-blue-600 text-white rounded-xl font-semibold">Kirim Ujian</button>
                         </div>
                      ) : (
                         <div className="p-6 bg-slate-50 rounded-xl border">
                            <p className="font-bold text-rose-600 mb-2">Kirim sekarang?</p>
                            <div className="flex gap-3">
                               <button onClick={()=>setShowConfirm(false)} className="flex-1 py-2.5 bg-white border rounded-lg font-medium">Batal</button>
                               <button onClick={handleFinalSubmit} disabled={isSubmitting} className="flex-1 py-2.5 bg-emerald-600 text-white rounded-lg font-semibold">{isSubmitting ? 'Mengirim...' : 'Ya, Kirim'}</button>
                            </div>
                         </div>
                      )}
                   </div>
               </div>
             );
          };

          const ExamSubmitted = () => (
            <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                <div className="bg-white p-10 rounded-2xl shadow-xl text-center max-w-md w-full border-t-4 border-emerald-500">
                   <div className="w-20 h-20 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-5"><CheckCircle size={40} /></div>
                   <h2 className="text-xl font-bold mb-3 text-slate-800">Ujian Selesai</h2>
                   <p className="text-slate-500 text-sm mb-8">Jawaban berhasil diunggah.</p>
                   <button onClick={() => { setActiveSession(null); navigate('/'); }} className="w-full px-6 py-3 bg-slate-800 text-white font-semibold rounded-xl">Beranda</button>
                </div>
            </div>
          );

          const AdminLogin = () => {
            const [u, setU] = useState(''); const [p, setP] = useState(''); const [showP, setShowP] = useState(false);
            return (
              <div className="min-h-screen bg-slate-900 flex justify-center items-center p-4">
                <form onSubmit={(e)=>{e.preventDefault(); if(u==='admin'&&p==='admin123'){setIsAdminLoggedIn(true); navigate('/admin/dashboard');}else alert('Salah');}} className="bg-white p-8 rounded-2xl max-w-sm w-full shadow-2xl">
                   <div className="text-center mb-6"><div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center mx-auto mb-3"><Settings size={24}/></div><h1 className="text-xl font-bold text-slate-800">Admin</h1></div>
                   <input type="text" placeholder="Username" value={u} onChange={e=>setU(e.target.value)} className="w-full p-3 border rounded-lg mb-3 text-sm" required/>
                   <div className="relative mb-6">
                       <input type={showP ? "text" : "password"} placeholder="Password" value={p} onChange={e=>setP(e.target.value)} className="w-full p-3 border rounded-lg text-sm pr-10" required/>
                       <button type="button" onClick={()=>setShowP(!showP)} className="absolute right-3 top-3 text-slate-400 hover:text-slate-600">{showP ? <EyeSlash size={18}/> : <Eye size={18}/>}</button>
                   </div>
                   <button type="submit" className="w-full py-3 bg-blue-600 text-white font-semibold rounded-lg">Login</button>
                   <button type="button" onClick={()=>navigate('/')} className="w-full mt-4 text-xs text-slate-500 font-medium">Kembali</button>
                </form>
              </div>
            );
          };

          const AdminLayout = ({ children, title }) => {
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            if (!isAdminLoggedIn) { navigate('/admin/login'); return null; }
            const menu = [
              { id: 'dashboard', label: 'Dashboard', icon: LayoutDashboard, path: '/admin/dashboard' },
              { id: 'questions', label: 'Bank Soal', icon: Database, path: '/admin/questions' },
              { id: 'tokens', label: 'Token Ujian', icon: Key, path: '/admin/tokens' },
              { id: 'results', label: 'Hasil Ujian', icon: CheckSquare, path: '/admin/results' },
              { id: 'analysis', label: 'Analisis Soal', icon: BarChart2, path: '/admin/analysis' },
              { id: 'reports', label: 'Cetak Laporan', icon: Printer, path: '/admin/reports' }
            ];
            return (
              <div className="min-h-screen bg-slate-50 flex print:block">
                {isMobileMenuOpen && <div className="fixed inset-0 bg-slate-900/60 z-40 lg:hidden" onClick={() => setIsMobileMenuOpen(false)} />}
                <div className={`fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 text-slate-300 flex flex-col transform ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} lg:relative lg:translate-x-0 transition-transform`}>
                  <div className="p-6 flex items-center justify-between border-b border-slate-800"><div className="flex items-center"><div className="w-8 h-8 bg-blue-500 text-white rounded flex items-center justify-center mr-3"><Settings size={16}/></div><span className="text-white font-bold">CBT ADMIN</span></div><button className="lg:hidden text-slate-400" onClick={() => setIsMobileMenuOpen(false)}><X size={20}/></button></div>
                  <nav className="flex-1 py-4 space-y-1 px-3">{menu.map(m => (<button key={m.id} onClick={() => { setIsMobileMenuOpen(false); navigate(m.path); }} className={`w-full flex items-center px-3 py-2.5 rounded-lg text-sm font-medium ${currentRoute.startsWith(m.path) ? 'bg-blue-500/10 text-blue-400' : 'text-slate-400 hover:bg-slate-800'}`}><m.icon size={18} className="mr-3"/> {m.label}</button>))}</nav>
                  <div className="p-4 border-t border-slate-800"><button onClick={() => { setIsAdminLoggedIn(false); navigate('/admin/login'); }} className="w-full flex items-center justify-center px-4 py-2 text-sm text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg"><LogOut size={16} className="mr-2"/> Keluar</button></div>
                </div>
                <div className="flex-1 flex flex-col h-screen overflow-hidden print:h-auto print:block">
                  <header className="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-10 print:hidden shadow-sm">
                    <div className="flex items-center gap-3"><button className="lg:hidden p-1.5 border rounded" onClick={() => setIsMobileMenuOpen(true)}><Menu size={20}/></button><h2 className="text-xl font-semibold text-slate-800">{title}</h2></div>
                    <span className="text-xs font-bold px-2.5 py-1 bg-emerald-50 text-emerald-600 border rounded-md flex items-center"><Cloud size={12} className="mr-1"/> Online</span>
                  </header>
                  <main className="flex-1 overflow-y-auto p-6 lg:p-8 print:p-0">{children}</main>
                </div>
              </div>
            );
          };

          const AdminDashboard = () => {
             const [tempOrganizer, setTempOrganizer] = useState(organizerName);
             const [tempLogo, setTempLogo] = useState(schoolLogo);
             const [tempDate, setTempDate] = useState(examDate);
             const [tempStartTime, setTempStartTime] = useState(startTimeStr);
             const [tempEndTime, setTempEndTime] = useState(endTimeStr);
             const [tempRandomQ, setTempRandomQ] = useState(isRandomQ);
             const [tempRandomOpt, setTempRandomOpt] = useState(isRandomOpt);
             const [isSaving, setIsSaving] = useState(false);

             const handleLogoUpload = (e) => {
                 const file = e.target.files[0];
                 if (file) {
                     const reader = new FileReader();
                     reader.onloadend = () => setTempLogo(reader.result);
                     reader.readAsDataURL(file);
                 }
             };

             const saveSettings = async () => {
                setIsSaving(true);
                try {
                    const db = await getSupabase();
                    const upsertSetting = async (code, val) => {
                        const { data } = await db.from('tokens').select('code').eq('code', code).maybeSingle();
                        if (data) await db.from('tokens').update({ status: val }).eq('code', code);
                        else await db.from('tokens').insert([{ code, status: val, generatedAt: new Date().toISOString() }]);
                    };

                    await Promise.all([
                        upsertSetting('SYS_SETTING_ORGANIZER', tempOrganizer),
                        upsertSetting('SYS_SETTING_LOGO', tempLogo),
                        upsertSetting('SYS_SETTING_DATE', tempDate),
                        upsertSetting('SYS_SETTING_START_TIME', tempStartTime),
                        upsertSetting('SYS_SETTING_END_TIME', tempEndTime),
                        upsertSetting('SYS_SETTING_RANDOM_Q', tempRandomQ ? 'TRUE' : 'FALSE'),
                        upsertSetting('SYS_SETTING_RANDOM_OPT', tempRandomOpt ? 'TRUE' : 'FALSE')
                    ]);

                    setOrganizerName(tempOrganizer);
                    setSchoolLogo(tempLogo);
                    setExamDate(tempDate);
                    setStartTimeStr(tempStartTime);
                    setEndTimeStr(tempEndTime);
                    setIsRandomQ(tempRandomQ);
                    setIsRandomOpt(tempRandomOpt);
                    alert("Pengaturan berhasil disimpan!");
                } catch(e) { alert("Gagal: " + e.message); }
                setIsSaving(false);
             };

             return (
                <AdminLayout title="Dashboard">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                    <div className="bg-white p-5 rounded-xl border shadow-sm"><div className="text-slate-500 text-xs mb-1">Peserta Selesai</div><div className="text-2xl font-bold">{results.length}</div></div>
                    <div className="bg-white p-5 rounded-xl border shadow-sm"><div className="text-slate-500 text-xs mb-1">Total Soal</div><div className="text-2xl font-bold">{questions.length}</div></div>
                    <div className="bg-white p-5 rounded-xl border shadow-sm"><div className="text-slate-500 text-xs mb-1">Token Tersedia</div><div className="text-2xl font-bold">{tokens.filter(t => !t.code.startsWith('SYS_') && t.status === 'AVAILABLE').length}</div></div>
                </div>

                <div className="bg-blue-50 p-6 rounded-xl border border-blue-100 mb-8">
                    <h3 className="text-base font-semibold text-blue-900 mb-4 flex items-center"><Settings size={18} className="mr-2"/> Pengaturan Penerbitan Ujian</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div><label className="block text-sm font-semibold text-blue-800 mb-1">Nama Penyelenggara</label><input type="text" value={tempOrganizer} onChange={e=>setTempOrganizer(e.target.value)} className="w-full p-2.5 rounded-lg border bg-white text-sm"/></div>
                        <div>
                            <label className="block text-sm font-semibold text-blue-800 mb-1">Unggah Logo Sekolah</label>
                            <div className="flex items-center gap-3">
                                {tempLogo && <img src={tempLogo} alt="Logo" className="w-10 h-10 object-cover rounded border"/>}
                                <input type="file" accept="image/*" onChange={handleLogoUpload} className="w-full p-2 text-xs bg-white rounded border"/>
                            </div>
                        </div>
                        <div><label className="block text-sm font-semibold text-blue-800 mb-1">Tanggal Ujian</label><input type="date" value={tempDate} onChange={e=>setTempDate(e.target.value)} className="w-full p-2.5 rounded-lg border bg-white text-sm"/></div>
                        <div className="grid grid-cols-2 gap-2">
                            <div><label className="block text-sm font-semibold text-blue-800 mb-1">Mulai Jam</label><input type="time" value={tempStartTime} onChange={e=>setTempStartTime(e.target.value)} className="w-full p-2.5 rounded-lg border bg-white text-sm"/></div>
                            <div><label className="block text-sm font-semibold text-blue-800 mb-1">Sampai Jam</label><input type="time" value={tempEndTime} onChange={e=>setTempEndTime(e.target.value)} className="w-full p-2.5 rounded-lg border bg-white text-sm"/></div>
                        </div>
                        <div className="md:col-span-2 bg-white/60 p-4 rounded-xl border flex flex-wrap gap-x-8 gap-y-3">
                            <label className="flex items-center cursor-pointer text-sm font-semibold text-blue-900"><input type="checkbox" checked={tempRandomQ} onChange={e=>setTempRandomQ(e.target.checked)} className="w-5 h-5 mr-2"/> Acak Urutan Soal</label>
                            <label className="flex items-center cursor-pointer text-sm font-semibold text-blue-900"><input type="checkbox" checked={tempRandomOpt} onChange={e=>setTempRandomOpt(e.target.checked)} className="w-5 h-5 mr-2"/> Acak Opsi Jawaban</label>
                        </div>
                    </div>
                    <div className="mt-5 flex justify-end"><button onClick={saveSettings} disabled={isSaving} className="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-semibold hover:bg-blue-700">{isSaving ? 'Menyimpan...' : 'Simpan Pengaturan'}</button></div>
                </div>
                </AdminLayout>
             );
          };

          const AdminTokens = () => {
             const [isSaving, setIsSaving] = useState(false);
             const [showImport, setShowImport] = useState(false);
             const [fileUploadError, setFileUploadError] = useState('');
             const [isMassEdit, setIsMassEdit] = useState(false);
             const [massEditTokens, setMassEditTokens] = useState([]);
             
             const [selectedTokens, setSelectedTokens] = useState([]);
             const [downloadFilter, setDownloadFilter] = useState('Semua');
             const [editFilter, setEditFilter] = useState('Semua');
             const [sortOrder, setSortOrder] = useState('DEFAULT'); // Sortir A-Z

             const actualTokens = tokens.filter(t => !t.code.startsWith('SYS_SETTING_') && !t.code.startsWith('SYS_FOLDER_'));
             const uniqueClasses = [...new Set(actualTokens.map(t => t.participant_school).filter(Boolean))];
             const uniqueEditClasses = [...new Set(massEditTokens.map(t => t.participant_school).filter(Boolean))];

             let displayedTokens = downloadFilter === 'Semua' ? [...actualTokens] : actualTokens.filter(t => t.participant_school === downloadFilter);
             if (sortOrder === 'NAME_ASC') displayedTokens.sort((a,b) => (a.participant_name || '').localeCompare(b.participant_name || ''));
             else if (sortOrder === 'NAME_DESC') displayedTokens.sort((a,b) => (b.participant_name || '').localeCompare(a.participant_name || ''));

             let displayedMassEditTokens = editFilter === 'Semua' ? [...massEditTokens] : massEditTokens.filter(t => t.participant_school === editFilter);
             if (sortOrder === 'NAME_ASC') displayedMassEditTokens.sort((a,b) => (a.participant_name || '').localeCompare(b.participant_name || ''));
             else if (sortOrder === 'NAME_DESC') displayedMassEditTokens.sort((a,b) => (b.participant_name || '').localeCompare(a.participant_name || ''));

             const handleSelectAll = (e) => {
                 if (e.target.checked) setSelectedTokens(displayedTokens.map(t => t.code));
                 else setSelectedTokens([]);
             };

             const handleSelectAllEdit = (e) => {
                 if (e.target.checked) setSelectedTokens(displayedMassEditTokens.map(t => t.code));
                 else setSelectedTokens([]);
             };

             const handleSelectToken = (code) => {
                 if (selectedTokens.includes(code)) setSelectedTokens(selectedTokens.filter(t => t !== code));
                 else setSelectedTokens([...selectedTokens, code]);
             };

             const handleDeleteSelected = async () => {
                 if (selectedTokens.length === 0) return;
                 if (!confirm(`Hapus permanen ${selectedTokens.length} data terpilih?`)) return;
                 setIsSaving(true);
                 try {
                     const db = await getSupabase();
                     const { error } = await db.from('tokens').delete().in('code', selectedTokens);
                     if (error) throw error;
                     await fetchSupabaseData(); 
                     setSelectedTokens([]); 
                     alert("Data terpilih berhasil dihapus.");
                 } catch (err) { alert("Gagal hapus masal: " + err.message); } 
                 finally { setIsSaving(false); }
             };

             const downloadPeserta = () => {
                 if (displayedTokens.length === 0) return alert("Tidak ada data untuk difilter.");
                 const printWindow = window.open('', '_blank');
                 const dateStr = new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
                 
                 let tableRowsHTML = '';
                 displayedTokens.forEach((t, i) => {
                     tableRowsHTML += `<tr><td class="text-center">${i + 1}</td><td style="text-transform: uppercase; font-weight: 600;">${t.participant_name || '-'}</td><td>${t.participant_school || '-'}</td><td class="text-center token-font">${t.code}</td><td class="text-center"><span class="status ${t.status === 'AVAILABLE' ? 'status-available' : 'status-used'}">${t.status}</span></td></tr>`;
                 });

                 const htmlContent = `
                     <!DOCTYPE html><html><head><title>Data_Token_${downloadFilter.replace(/\s+/g, '_')}</title>
                     <style>
                         body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #333; padding: 20px; }
                         .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #1e293b; padding-bottom: 15px; }
                         .header h2 { margin: 0 0 5px 0; color: #0f172a; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
                         table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
                         th, td { border: 1px solid #cbd5e1; padding: 10px 12px; text-align: left; }
                         th { background-color: #f8fafc; font-weight: bold; text-transform: uppercase; font-size: 11px; color: #475569; }
                         .text-center { text-align: center; } .token-font { font-family: monospace; font-weight: bold; color: #2563eb; font-size: 14px; letter-spacing: 1px; }
                         .status { font-weight: bold; font-size: 10px; padding: 3px 6px; border-radius: 4px; text-transform: uppercase; }
                         .status-available { background-color: #d1fae5; color: #065f46; border: 1px solid #34d399; } .status-used { background-color: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
                         @media print { @page { margin: 1.5cm; } body { padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
                     </style></head><body>
                         <div class="header"><h2>Daftar Token Ujian Peserta</h2><p>Filter: <strong>${downloadFilter}</strong> &nbsp;|&nbsp; Unduh: ${dateStr}</p></div>
                         <table><thead><tr><th class="text-center" style="width: 5%;">No</th><th style="width: 30%;">Nama Peserta</th><th style="width: 30%;">Asal Sekolah / Kelas</th><th class="text-center" style="width: 20%;">Token</th><th class="text-center" style="width: 15%;">Status</th></tr></thead>
                         <tbody>${tableRowsHTML}</tbody></table>
                         <script>window.onload = function() { setTimeout(function() { window.print(); window.close(); }, 500); }<${'/'}script>
                     </body></html>`;
                 printWindow.document.open(); printWindow.document.write(htmlContent); printWindow.document.close();
             };

             const addManual = async () => {
                 const name = prompt("Nama Peserta:"); if (!name) return;
                 const school = prompt("Asal Sekolah:") || organizerName;
                 const newCode = `TKA-${Math.random().toString(36).substring(2,6).toUpperCase()}`;
                 setIsSaving(true);
                 try { const db = await getSupabase(); await db.from('tokens').insert([{ code: newCode, status: 'AVAILABLE', participant_name: name, participant_school: school, generatedAt: new Date().toISOString() }]); fetchSupabaseData(); } catch(e) { alert(e.message); }
                 setIsSaving(false);
             };

             const startMassEdit = () => {
                 setEditFilter('Semua');
                 if (selectedTokens.length > 0) {
                     const tokensToEdit = displayedTokens.filter(t => selectedTokens.includes(t.code));
                     setMassEditTokens(JSON.parse(JSON.stringify(tokensToEdit)));
                 } else {
                     setMassEditTokens(JSON.parse(JSON.stringify(displayedTokens)));
                 }
                 setSelectedTokens([]); setIsMassEdit(true);
             };

             const handleMassEditChange = (index, field, value) => {
                 const updated = [...massEditTokens]; updated[index][field] = value; setMassEditTokens(updated);
             };

             const handleBulkEditStatus = (status) => {
                 if (selectedTokens.length === 0) return alert("Pilih baris terlebih dahulu dengan mencentang kotak di kiri!");
                 const updated = massEditTokens.map(t => selectedTokens.includes(t.code) ? { ...t, status } : t);
                 setMassEditTokens(updated);
             };

             const saveMassEdit = async () => {
                 setIsSaving(true);
                 try {
                     const db = await getSupabase();
                     await db.from('tokens').upsert(massEditTokens.map(t => ({ code: t.code, status: t.status, participant_name: t.participant_name, participant_school: t.participant_school })));
                     fetchSupabaseData(); setIsMassEdit(false); setSelectedTokens([]); alert("Data berhasil diperbarui!");
                 } catch(e) { alert(e.message); }
                 setIsSaving(false);
             };

             const deleteToken = async (code) => {
                 if(!confirm(`Hapus token ${code}?`)) return;
                 setIsSaving(true);
                 try { const db = await getSupabase(); await db.from('tokens').delete().eq('code', code); fetchSupabaseData(); } catch(e) { alert(e.message); }
                 setIsSaving(false);
             };

             return (
               <AdminLayout title="Token Ujian">
                 <div className="bg-white p-4 rounded-xl border mb-6 flex flex-wrap gap-3 items-center shadow-sm">
                    {!isMassEdit ? (
                        <>
                            <button onClick={addManual} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center transition-colors"><Plus size={16} className="mr-2"/> Tambah Manual</button>
                            <button onClick={() => setShowImport(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center transition-colors"><Upload size={16} className="mr-2"/> Unggah Peserta</button>
                            <button onClick={startMassEdit} disabled={displayedTokens.length===0} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center transition-colors disabled:opacity-50">
                                <Edit size={16} className="mr-2"/> {selectedTokens.length > 0 ? `Edit Terpilih (${selectedTokens.length})` : 'Edit'}
                            </button>
                            
                            <div className="flex flex-wrap items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl p-1 ml-auto">
                                <select value={sortOrder} onChange={e=>setSortOrder(e.target.value)} className="bg-white border border-slate-300 text-sm font-medium rounded-lg px-2 py-2.5 outline-none focus:border-blue-500 cursor-pointer">
                                    <option value="DEFAULT">Urutan Acak</option><option value="NAME_ASC">Nama A-Z</option><option value="NAME_DESC">Nama Z-A</option>
                                </select>
                                <select value={downloadFilter} onChange={(e) => {setDownloadFilter(e.target.value); setSelectedTokens([]);}} className="bg-white border border-slate-300 text-sm font-medium rounded-lg px-2 py-2.5 outline-none focus:border-blue-500 cursor-pointer">
                                    <option value="Semua">Semua Kelas/Sekolah</option>
                                    {uniqueClasses.map((cls, idx) => <option key={idx} value={cls}>{cls}</option>)}
                                </select>
                                <button onClick={downloadPeserta} className="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 px-4 py-2.5 rounded-lg font-bold text-sm transition-colors flex items-center border border-emerald-200"><i className="fas fa-file-pdf mr-2"></i> Cetak PDF</button>
                            </div>
                            
                            {selectedTokens.length > 0 && <button onClick={handleDeleteSelected} disabled={isSaving} className="bg-red-50 text-red-700 hover:bg-red-100 px-4 py-2.5 rounded-xl font-bold text-sm border border-red-200 transition-colors flex items-center"><i className="fas fa-trash-alt mr-2"></i> Hapus Terpilih ({selectedTokens.length})</button>}
                        </>
                    ) : (
                        <div className="w-full flex flex-wrap gap-2 items-center justify-between">
                            <div className="flex gap-2">
                                <button onClick={saveMassEdit} disabled={isSaving} className="bg-emerald-700 text-white px-5 py-2.5 rounded-lg text-sm font-semibold shadow-md"><Save size={16} className="inline mr-2"/> Simpan Perubahan</button>
                                <button onClick={() => { setIsMassEdit(false); setSelectedTokens([]); }} className="bg-slate-200 text-slate-700 hover:bg-slate-300 px-5 py-2.5 rounded-lg text-sm font-semibold transition-colors">Batal</button>
                            </div>
                            <div className="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl p-1 ml-auto">
                                <select value={sortOrder} onChange={e=>setSortOrder(e.target.value)} className="bg-white border border-slate-300 text-sm font-medium rounded-lg px-2 py-1.5 outline-none focus:border-blue-500 cursor-pointer">
                                    <option value="DEFAULT">Urutan Acak</option><option value="NAME_ASC">Nama A-Z</option><option value="NAME_DESC">Nama Z-A</option>
                                </select>
                                <select value={editFilter} onChange={e => {setEditFilter(e.target.value); setSelectedTokens([]);}} className="bg-white border border-slate-300 text-sm font-medium rounded-lg px-3 py-1.5 outline-none focus:border-blue-500 cursor-pointer">
                                    <option value="Semua">Semua Kelas/Sekolah</option>
                                    {uniqueEditClasses.map((cls, idx) => <option key={idx} value={cls}>{cls}</option>)}
                                </select>
                            </div>
                        </div>
                    )}
                 </div>
                 
                 {/* Modal Import (Dipersingkat tampilannya) */}
                 {showImport && (
                     <div className="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-xl shadow-xl w-full max-w-lg p-5">
                            <div className="flex justify-between items-center mb-4"><h3 className="font-bold">Impor Peserta</h3><button onClick={()=>setShowImport(false)}><X size={18}/></button></div>
                            <button onClick={() => {}} className="mb-4 bg-blue-50 border text-blue-700 px-4 py-2 rounded-lg text-sm font-semibold flex items-center"><FileText size={16} className="mr-2"/> Download Templat</button>
                            <input type="file" accept=".csv" onChange={()=>{}} className="w-full p-4 border-2 border-dashed rounded-xl"/>
                        </div>
                     </div>
                 )}
                 
                 <div className="bg-white rounded-xl border overflow-x-auto shadow-sm">
                    <table className="w-full text-left text-sm">
                        <thead className="bg-slate-50 border-b">
                            <tr>
                                <th className="p-4 text-center w-12"><input type="checkbox" className="w-4 h-4 cursor-pointer accent-blue-600 rounded" onChange={isMassEdit ? handleSelectAllEdit : handleSelectAll} checked={selectedTokens.length > 0 && selectedTokens.length === (isMassEdit ? displayedMassEditTokens.length : displayedTokens.length)} /></th>
                                <th className="p-4 w-12 text-center">No</th><th className="p-4">Nama</th><th className="p-4">Sekolah/Kelas</th><th className="p-4">Token</th>
                                {isMassEdit ? (
                                    <th className="p-4 min-w-[160px]">Status
                                        <select onChange={(e) => { if(e.target.value) handleBulkEditStatus(e.target.value); e.target.value=''; }} className="mt-1.5 w-full border border-slate-300 rounded text-xs font-bold text-blue-700 bg-blue-50 p-1.5 outline-none cursor-pointer">
                                            <option value="">+ Set Terpilih</option><option value="AVAILABLE">AVAILABLE</option><option value="USED">USED</option><option value="EXPIRED">EXPIRED</option>
                                        </select>
                                    </th>
                                ) : (<th className="p-4 text-center">Status</th>)}
                                {!isMassEdit && <th className="p-4 text-center">Aksi</th>}
                            </tr>
                        </thead>
                        <tbody>
                            {isMassEdit ? (
                                displayedMassEditTokens.map((t, idx) => {
                                    const originalIndex = massEditTokens.findIndex(orig => orig.code === t.code);
                                    return (
                                        <tr key={t.code} className={`border-b ${selectedTokens.includes(t.code) ? 'bg-blue-50/60' : 'bg-white'}`}>
                                            <td className="p-3 text-center"><input type="checkbox" className="w-4 h-4 cursor-pointer accent-blue-600 rounded" checked={selectedTokens.includes(t.code)} onChange={() => handleSelectToken(t.code)} /></td>
                                            <td className="p-3 text-center text-slate-500 font-semibold">{idx+1}</td>
                                            <td className="p-2"><input type="text" value={t.participant_name} onChange={e=>handleMassEditChange(originalIndex, 'participant_name', e.target.value)} className="w-full p-2 border border-blue-200 rounded text-sm outline-none focus:ring-1"/></td>
                                            <td className="p-2"><input type="text" value={t.participant_school} onChange={e=>handleMassEditChange(originalIndex, 'participant_school', e.target.value)} className="w-full p-2 border border-blue-200 rounded text-sm outline-none focus:ring-1"/></td>
                                            <td className="p-3 font-mono font-bold text-slate-500">{t.code}</td>
