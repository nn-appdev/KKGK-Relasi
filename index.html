                            body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 10px; color: #333; padding: 10px; }
                            .header { text-align: center; margin-bottom: 20px; }
                            .header h2 { margin: 0 0 5px 0; font-size: 16px; text-transform: uppercase; letter-spacing: 1px;}
                            table { width: 100%; border-collapse: collapse; margin-top: 10px; }
                            th, td { border: 1px solid #cbd5e1; padding: 4px; }
                            th { background-color: #f1f5f9; font-weight: bold; text-align: center; font-size: 9px; color: #475569; }
                            td { font-size: 9px; }
                            .legend { display: flex; gap: 20px; margin-top: 15px; font-size: 10px; font-weight: bold; justify-content: center; color: #64748b; }
                            @media print {
                                @page { size: landscape; margin: 1cm; } /* Memaksa print landscape */
                                body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                            }
                        </style>
                    </head>
                    <body>
                        <div class="header">
                            <h2>Laporan Matriks Analisis Jawaban Siswa</h2>
                            <p style="margin:0; font-size:11px; color:#64748b;">Kategori / Mapel: <strong style="color:#0f172a;">${filterFolder}</strong> &nbsp;|&nbsp; Sekolah: <strong style="color:#0f172a;">${filterSchool}</strong></p>
                        </div>
                        <table>
                            <thead><tr>${tableHeaders}</tr></thead>
                            <tbody>${tableRows}</tbody>
                        </table>
                        <div class="legend">
                            <span><span style="color:#059669">B:</span> Benar</span>
                            <span><span style="color:#e11d48">S:</span> Salah</span>
                            <span><span style="color:#2563eb">P:</span> Parsial (Benar Sebagian)</span>
                            <span><span style="color:#d97706">K:</span> Kosong</span>
                        </div>
                        <script>window.onload = function() { setTimeout(function() { window.print(); window.close(); }, 500); }<${'/'}script>
                    </body>
                    </html>
                `;
                printWindow.document.open();
                printWindow.document.write(htmlContent);
                printWindow.document.close();
            };

            return (
              <AdminLayout title="Analisis Data Ujian">
                <div className="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-6 gap-4">
                    <div className="bg-white rounded-xl border p-2 flex-1 w-full xl:w-auto shadow-sm flex flex-col xl:flex-row gap-3 items-start xl:items-center">
                       <div className="flex gap-1 p-1 bg-slate-100 rounded-lg w-full sm:w-auto shrink-0">
                           <button onClick={() => setActiveTab('BUTIR')} className={`flex-1 sm:flex-none px-4 py-2 rounded-md text-sm font-bold transition-colors ${activeTab === 'BUTIR' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>Analisis Butir Soal</button>
                           <button onClick={() => setActiveTab('INDIVIDU')} className={`flex-1 sm:flex-none px-4 py-2 rounded-md text-sm font-bold transition-colors ${activeTab === 'INDIVIDU' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>Analisis Per Siswa</button>
                       </div>
                       
                       <div className="flex flex-wrap items-center gap-2 xl:border-l xl:pl-3 w-full sm:w-auto bg-slate-50 p-1.5 rounded-lg border border-slate-200 xl:border-none xl:bg-transparent">
                           <select value={filterSchool} onChange={e=>setFilterSchool(e.target.value)} className="border-none py-1 px-2 text-sm bg-transparent font-semibold focus:ring-0 outline-none cursor-pointer text-slate-700 w-full sm:w-auto">
                               {schoolList.map(s => <option key={s} value={s}>{s === 'Semua' ? 'Sekolah: Semua' : s}</option>)}
                           </select>
                           <div className="w-px h-5 bg-slate-300 hidden sm:block"></div>
                           <select value={filterDate} onChange={e=>setFilterDate(e.target.value)} className="border-none py-1 px-2 text-sm bg-transparent font-semibold focus:ring-0 outline-none cursor-pointer text-emerald-700 w-full sm:w-auto">
                               {dateList.map(d => <option key={d} value={d}>{d === 'Semua' ? 'Tanggal: Semua' : d}</option>)}
                           </select>
                           <div className="w-px h-5 bg-slate-300 hidden sm:block"></div>
                           <select value={filterFolder} onChange={e=>setFilterFolder(e.target.value)} className="border-none py-1 px-2 text-sm bg-transparent font-semibold focus:ring-0 outline-none cursor-pointer text-blue-700 w-full sm:w-auto">
                               {availableFolders.map(f => <option key={f} value={f}>{f === 'Semua' ? 'Kategori: Semua' : f}</option>)}
                           </select>
                       </div>
                    </div>

                    <div className="flex flex-wrap gap-2 w-full xl:w-auto">
                        {activeTab === 'INDIVIDU' && (
                            <>
                                <select value={sortOrder} onChange={e=>setSortOrder(e.target.value)} className="flex-1 sm:flex-none border border-slate-300 rounded-xl p-2.5 text-sm bg-white font-semibold outline-none cursor-pointer">
                                    <option value="DEFAULT">Urutan Waktu</option><option value="NAME_ASC">Nama A-Z</option><option value="NAME_DESC">Nama Z-A</option>
                                </select>
                                <button onClick={downloadMatrixPDF} disabled={filterFolder === 'Semua' || matrixResults.length === 0} className="flex-1 sm:flex-none bg-emerald-50 text-emerald-700 border border-emerald-200 px-4 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center hover:bg-emerald-100 shadow-sm disabled:opacity-50 transition-colors">
                                    <i className="fas fa-file-pdf mr-2"></i> PDF Matriks
                                </button>
                            </>
                        )}
                        {activeTab === 'BUTIR' && (
                            <button onClick={downloadAnalisis} className="flex-1 sm:flex-none bg-emerald-50 text-emerald-700 border border-emerald-200 px-4 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center hover:bg-emerald-100 shadow-sm"><i className="fas fa-download mr-2"></i> CSV</button>
                        )}
                        <button onClick={fetchSupabaseData} className="flex-1 sm:flex-none bg-blue-50 text-blue-600 border border-blue-200 px-4 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center hover:bg-blue-100 shadow-sm"><i className="fas fa-sync-alt"></i></button>
                        <button onClick={deleteAllResults} disabled={isDeleting || results.length === 0} className="w-full sm:w-auto bg-rose-600 text-white px-4 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center hover:bg-rose-700 disabled:opacity-50 shadow-sm">
                            <Trash2 size={16} className="mr-2"/> Hapus Semua
                        </button>
                    </div>
                </div>
                
                {activeTab === 'BUTIR' ? (
                    <>
                        <div className="bg-blue-50 border border-blue-100 rounded-xl p-4 mb-6 flex flex-wrap gap-4 items-center text-xs font-medium text-slate-700 shadow-sm">
                            <span className="font-bold text-blue-900 mr-2"><i className="fas fa-info-circle mr-1"></i> Indikator Kesulitan (Data Aktual Terfilter):</span>
                            <span className="bg-emerald-100 text-emerald-800 px-2 py-1 rounded">Sangat Mudah (&gt;85%)</span>
                            <span className="bg-emerald-50 text-emerald-700 px-2 py-1 rounded border border-emerald-200">Mudah (70-85%)</span>
                            <span className="bg-blue-100 text-blue-800 px-2 py-1 rounded">Sedang (50-69%)</span>
                            <span className="bg-rose-50 text-rose-700 px-2 py-1 rounded border border-rose-200">Sulit (30-49%)</span>
                            <span className="bg-rose-100 text-rose-800 px-2 py-1 rounded">Sangat Sulit (&lt;30%)</span>
                        </div>
                        <div className="bg-white rounded-xl border overflow-x-auto shadow-sm">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-slate-50 border-b">
                                    <tr>
                                        <th className="p-4 text-center w-12">No</th><th className="p-4">Kategori / Tipe</th><th className="p-4">Pertanyaan (Cuplikan)</th>
                                        <th className="p-4 text-center">Benar</th><th className="p-4 text-center">Salah</th><th className="p-4 text-center">Kosong</th><th className="p-4 text-center">% Benar</th><th className="p-4 text-center">Kesulitan</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {analysisData.map((d, idx) => {
                                        const tempDiv = document.createElement("div"); tempDiv.innerHTML = d.question || "";
                                        const plainText = tempDiv.textContent || tempDiv.innerText || "";
                                        return (
                                        <tr key={d.id} className="border-b hover:bg-slate-50 transition-colors">
                                            <td className="p-4 text-center font-bold text-slate-500">{idx + 1}</td>
                                            <td className="p-4"><div className="font-semibold text-slate-700">{d.category || d.folder || 'Utama'}</div><div className="text-[10px] uppercase font-bold text-blue-500 bg-blue-50 inline-block px-2 py-0.5 rounded mt-1 border border-blue-100">{d.type}</div></td>
                                            <td className="p-4 max-w-xs truncate text-slate-600" title={plainText}>{plainText}</td>
                                            <td className="p-4 text-center font-bold text-emerald-600">{d.correct}</td>
                                            <td className="p-4 text-center font-bold text-rose-600">{d.wrong}</td>
                                            <td className="p-4 text-center font-bold text-slate-400">{d.empty}</td>
                                            <td className="p-4 text-center font-black text-blue-600">{d.percentage}%</td>
                                            <td className="p-4 text-center"><span className={`px-2 py-1 rounded text-xs font-bold border ${d.difficulty.includes('Mudah') ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : d.difficulty === 'Sedang' ? 'bg-blue-50 text-blue-700 border-blue-200' : d.difficulty.includes('Sulit') ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-slate-50 text-slate-500 border-slate-200'}`}>{d.difficulty}</span></td>
                                        </tr>
                                    )})}
                                    {analysisData.length === 0 && <tr><td colSpan="8" className="text-center p-8 text-slate-500 font-bold bg-slate-50">Belum ada data soal pada filter ini.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </>
                ) : (
                    <>
                        {filterFolder === 'Semua' ? (
                            <div className="bg-amber-50 border border-amber-200 p-8 rounded-xl text-center shadow-sm">
                                <AlertCircle size={48} className="mx-auto text-amber-500 mb-4"/>
                                <h3 className="text-lg font-bold text-amber-800 mb-2">Pilih Filter Kategori/Folder!</h3>
                                <p className="text-amber-700 text-sm font-medium">Anda harus memilih satu Kategori (Folder Soal) yang spesifik di menu atas untuk melihat Matriks Analisis Individu agar tabel tidak memanjang keluar layar.</p>
                            </div>
                        ) : (
                            <div className="bg-white rounded-xl border overflow-x-auto shadow-sm pb-4">
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="bg-slate-50 border-b">
                                        <tr>
                                            <th className="p-4 border-r w-12 text-center text-slate-600 font-bold">No</th>
                                            <th className="p-4 border-r text-slate-600 font-bold min-w-[200px]">Nama Peserta</th>
                                            {filteredQuestions.map((q, i) => (
                                                <th key={q.id} className="p-4 border-r text-center text-slate-600 font-bold w-12" title={q.question?.replace(/<[^>]+>/g, '')}>{i+1}</th>
                                            ))}
                                            <th className="p-4 border-r text-center text-slate-600 font-bold bg-blue-50">Jml Skor</th>
                                            <th className="p-4 text-center text-slate-600 font-bold bg-emerald-50">Nilai Akhir</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {matrixResults.map((r, i) => {
                                            const details = Array.isArray(r.detail?.detailedResults) ? r.detail.detailedResults : [];
                                            const earned = details.reduce((sum, d) => sum + (d.pointsEarned || 0), 0);
                                            return (
                                                <tr key={r.id} className="border-b hover:bg-slate-50">
                                                    <td className="p-4 border-r text-center text-slate-500 font-medium">{i+1}</td>
                                                    <td className="p-4 border-r font-bold text-slate-800 uppercase">{r.participant?.name}</td>
                                                    {filteredQuestions.map((q) => {
                                                        const d = details.find(x => x.qId === q.id);
                                                        let status = '-'; let colorClass = 'text-slate-300';
                                                        if (d) {
                                                            if (d.isEmpty) { status = 'K'; colorClass = 'text-amber-500 font-bold bg-amber-50'; }
                                                            else if (d.isCorrect) { status = 'B'; colorClass = 'text-emerald-600 font-bold bg-emerald-50'; }
                                                            else if (d.pointsEarned > 0) { status = 'P'; colorClass = 'text-blue-600 font-bold bg-blue-50'; } // Partial
                                                            else { status = 'S'; colorClass = 'text-rose-600 font-bold bg-rose-50'; }
                                                        }
                                                        return <td key={q.id} className={`p-4 border-r text-center ${colorClass}`}>{status}</td>;
                                                    })}
                                                    <td className="p-4 border-r text-center font-bold text-blue-700 bg-blue-50/30">{earned}</td>
                                                    <td className="p-4 text-center font-black text-emerald-600 bg-emerald-50/30">{r.score}</td>
                                                </tr>
                                            );
                                        })}
                                        {matrixResults.length === 0 && <tr><td colSpan={filteredQuestions.length + 4} className="text-center p-8 text-slate-500 font-bold">Tidak ada peserta yang mengambil ujian pada kategori dan tanggal ini.</td></tr>}
                                    </tbody>
                                </table>
                                <div className="mt-4 px-6 flex gap-4 text-xs font-bold text-slate-500">
                                    <span><span className="text-emerald-600">B:</span> Benar</span>
                                    <span><span className="text-rose-600">S:</span> Salah</span>
                                    <span><span className="text-blue-600">P:</span> Parsial (Benar Sebagian)</span>
                                    <span><span className="text-amber-500">K:</span> Kosong</span>
                                </div>
                            </div>
                        )}
                    </>
                )}
              </AdminLayout>
            );
          };

          const AdminReports = () => {
             const [filterSchool, setFilterSchool] = useState('Semua');
             const [filterDate, setFilterDate] = useState('Semua');
             const [sortOrder, setSortOrder] = useState('DEFAULT');
             const [activeTab, setActiveTab] = useState('NILAI');
             
             const schoolList = ['Semua', ...new Set(results.map(r => r.participant?.school).filter(Boolean))];
             const dateList = ['Semua', ...new Set(results.map(r => new Date(r.startTime).toLocaleDateString('id-ID')))];
             
             let processedResults = results.filter(r => {
                 const matchSchool = filterSchool === 'Semua' || r.participant?.school === filterSchool;
                 const matchDate = filterDate === 'Semua' || new Date(r.startTime).toLocaleDateString('id-ID') === filterDate;
                 return matchSchool && matchDate;
             });
             
             // Logika Sortir Lengkap (Waktu, Nama, Ranking)
             if (sortOrder === 'RANK_DESC') {
                 processedResults.sort((a, b) => b.score - a.score);
             } else if (sortOrder === 'RANK_ASC') {
                 processedResults.sort((a, b) => a.score - b.score);
             } else if (sortOrder === 'NAME_ASC') {
                 processedResults.sort((a, b) => (a.participant?.name || '').localeCompare(b.participant?.name || ''));
             }

             // Kalkulasi Statistik Logis (Mean & Std Dev)
             const scores = processedResults.map(r => r.score);
             const validCount = scores.length;
             const meanScore = validCount > 0 ? (scores.reduce((a,b) => a + b, 0) / validCount) : 0;
             const variance = validCount > 0 ? (scores.reduce((a,b) => a + Math.pow(b - meanScore, 2), 0) / validCount) : 0;
             const stdDeviation = Math.sqrt(variance);

             return (
                <AdminLayout title="Cetak Laporan Dokumen (F4)">
                   <div className="mb-6 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 bg-white p-4 rounded-xl border shadow-sm print:hidden">
                      <div className="flex gap-2 bg-slate-100 p-1.5 rounded-lg w-full xl:w-auto shrink-0">
                          <button onClick={() => setActiveTab('NILAI')} className={`flex-1 sm:flex-none px-4 py-2 rounded-md text-sm font-bold transition-colors ${activeTab === 'NILAI' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>Rekap Nilai</button>
                          <button onClick={() => setActiveTab('PELANGGARAN')} className={`flex-1 sm:flex-none px-4 py-2 rounded-md text-sm font-bold transition-colors ${activeTab === 'PELANGGARAN' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>Laporan Pelanggaran</button>
                      </div>
                      
                      <div className="flex flex-wrap items-center gap-3 w-full xl:w-auto">
                         <div className="flex items-center bg-slate-50 border border-slate-200 rounded-lg p-1 gap-1">
                             <select value={filterSchool} onChange={e=>setFilterSchool(e.target.value)} className="border-none bg-transparent p-2 text-sm font-semibold outline-none cursor-pointer text-slate-700">
                                {schoolList.map(s => <option key={s} value={s}>{s === 'Semua' ? 'Sekolah: Semua' : s}</option>)}
                             </select>
                             <div className="w-px h-6 bg-slate-300"></div>
                             <select value={filterDate} onChange={e=>setFilterDate(e.target.value)} className="border-none bg-transparent p-2 text-sm font-semibold outline-none cursor-pointer text-emerald-700">
                                {dateList.map(d => <option key={d} value={d}>{d === 'Semua' ? 'Tanggal: Semua' : d}</option>)}
                             </select>
                         </div>
                         
                         <select value={sortOrder} onChange={e=>setSortOrder(e.target.value)} className="border border-slate-300 rounded-lg p-2.5 text-sm bg-white font-semibold outline-none cursor-pointer">
                            <option value="DEFAULT">Urutan Terbaru</option>
                            <option value="NAME_ASC">Nama A-Z</option>
                            <option value="RANK_DESC">Ranking Tertinggi</option>
                            <option value="RANK_ASC">Ranking Terendah</option>
                         </select>
                         
                         <button onClick={fetchSupabaseData} className="bg-blue-50 text-blue-600 border border-blue-200 px-3 py-2.5 rounded-lg text-sm font-bold flex items-center hover:bg-blue-100 transition-colors" title="Muat Ulang Data">
                            <i className="fas fa-sync-alt"></i>
                         </button>
                         <button onClick={() => window.print()} className="bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-lg font-bold text-sm flex items-center shadow-md transition-colors"><i className="fas fa-file-pdf mr-2"></i> Cetak Laporan (PDF)</button>
                      </div>
                   </div>
                   
                   <div className="bg-white border shadow-md mx-auto w-full max-w-[21.5cm] min-h-[33cm] p-8 sm:p-12 print-container">
                      <div className="text-center border-b-2 border-slate-800 pb-4 mb-6">
                         <h1 className="text-xl font-bold uppercase tracking-widest text-slate-900 mb-1">{activeTab === 'NILAI' ? 'Laporan Hasil Ujian' : 'Laporan Deteksi Pelanggaran'}</h1>
                         <p className="text-slate-600 font-medium">{organizerName}</p>
                      </div>
                      
                      <div className={`mb-6 grid gap-4 text-sm bg-slate-50 p-4 rounded-lg border border-slate-200 ${activeTab === 'NILAI' ? 'grid-cols-2 md:grid-cols-5' : 'grid-cols-2 md:grid-cols-3'}`}>
                         <div><p className="text-slate-500 text-xs font-bold uppercase mb-1">Filter Sekolah</p><p className="font-black text-blue-800">{filterSchool}</p></div>
                         <div><p className="text-slate-500 text-xs font-bold uppercase mb-1">Tanggal Ujian</p><p className="font-black text-emerald-700">{filterDate}</p></div>
                         <div><p className="text-slate-500 text-xs font-bold uppercase mb-1">Total Peserta</p><p className="font-black text-slate-800">{validCount} Siswa</p></div>
                         {activeTab === 'NILAI' && (
                             <>
                                <div><p className="text-slate-500 text-xs font-bold uppercase mb-1">Rata-Rata Nilai</p><p className="font-black text-emerald-700">{meanScore.toFixed(2)}</p></div>
                                <div><p className="text-slate-500 text-xs font-bold uppercase mb-1">Standar Deviasi</p><p className="font-black text-amber-600">± {stdDeviation.toFixed(2)}</p></div>
                             </>
                         )}
                      </div>
                      
                      <table className="w-full text-left border-collapse border border-slate-800 text-sm">
                         <thead className="bg-slate-100 uppercase font-bold text-xs"><tr className="border-b border-slate-800">
                            <th className="border-r border-slate-800 py-2.5 px-3 text-center w-12">No</th>
                            <th className="border-r border-slate-800 py-2.5 px-3">Nama Peserta</th>
                            <th className="border-r border-slate-800 py-2.5 px-3">Asal Sekolah</th>
                            {activeTab === 'NILAI' ? (
                                <><th className="border-r border-slate-800 py-2.5 px-3 text-center w-28">Durasi</th><th className="py-2.5 px-3 text-center w-20">Nilai</th></>
                            ) : (
                                <><th className="border-r border-slate-800 py-2.5 px-3 text-center w-28">Status Keamanan</th><th className="py-2.5 px-3 text-center w-36">Peringatan</th></>
                            )}
                         </tr></thead>
                         <tbody>
                            {processedResults.map((r, i) => {
                               const durSecs = Math.max(0, Math.floor((r.endTime - r.startTime) / 1000));
                               const details = Array.isArray(r.detail?.detailedResults) ? r.detail.detailedResults : [];
                               const cheats = details.find(x => x.qId === 'SYS_CHEATS')?.cheatCount || 0;
                               return (
                               <tr key={i} className="border-b border-slate-800 font-medium">
                                  <td className="border-r border-slate-800 py-2.5 px-3 text-center">{i+1}</td>
                                  <td className="border-r border-slate-800 py-2.5 px-3 uppercase">{r.participant?.name}</td>
                                  <td className="border-r border-slate-800 py-2.5 px-3">{r.participant?.school}</td>
                                  {activeTab === 'NILAI' ? (
                                      <><td className="border-r border-slate-800 py-2.5 px-3 text-center text-xs">{`${Math.floor(durSecs/60)}m ${durSecs%60}s`}</td><td className="py-2.5 px-3 text-center font-bold text-blue-700 bg-blue-50/30">{r.score}</td></>
                                  ) : (
                                      <><td className="border-r border-slate-800 py-2.5 px-3 text-center">{cheats === 0 ? <span className="text-emerald-600 font-bold">AMAN</span> : <span className="text-rose-600 font-bold">TERDETEKSI</span>}</td><td className="py-2.5 px-3 text-center font-bold">{cheats === 0 ? '-' : <span className="text-rose-600">{cheats}x Pindah Tab</span>}</td></>
                                  )}
                               </tr>
                            )})}
                            {processedResults.length === 0 && <tr><td colSpan="5" className="text-center py-10 text-slate-500 italic">Tidak ada data peserta ujian untuk ditampilkan.</td></tr>}
                         </tbody>
                      </table>
                      <div className="mt-16 flex justify-end text-center text-slate-800 font-medium text-sm"><div><p className="mb-20">Mengetahui,<br/>Administrator Ujian</p><p className="font-bold underline uppercase">_______________________</p></div></div>
                   </div>
                </AdminLayout>
             );
          };

          switch (currentRoute) {
            case '/': case '/login': return <ParticipantLogin />;
            case '/instruction': return <ParticipantInstruction />;
            case '/exam': return <ExamEngine />;
            case '/review': return <ExamReview />;
            case '/submitted': return <ExamSubmitted />;
            case '/admin': case '/admin/login': return <AdminLogin />;
            case '/admin/dashboard': return <AdminDashboard />;
            case '/admin/tokens': return <AdminTokens />;
            case '/admin/results': return <AdminResults />;
            case '/admin/questions': return <AdminQuestions />;
            case '/admin/analysis': return <AdminItemAnalysis />;
            case '/admin/reports': return <AdminReports />;
            default: return <ParticipantLogin />;
          }
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
