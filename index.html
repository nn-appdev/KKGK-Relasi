                                            <td className="p-2"><select value={t.status} onChange={e=>handleMassEditChange(originalIndex, 'status', e.target.value)} className="w-full p-2 border border-blue-200 rounded text-xs font-bold outline-none cursor-pointer bg-white"><option value="AVAILABLE">AVAILABLE</option><option value="USED">USED</option><option value="EXPIRED">EXPIRED</option></select></td>
                                        </tr>
                                    );
                                })
                            ) : (
                                displayedTokens.map((t, i) => (
                                    <tr key={t.code} className={`border-b transition-colors ${selectedTokens.includes(t.code) ? 'bg-blue-50/40' : 'hover:bg-slate-50'}`}>
                                        <td className="p-4 text-center"><input type="checkbox" className="w-4 h-4 cursor-pointer accent-blue-600 rounded" checked={selectedTokens.includes(t.code)} onChange={() => handleSelectToken(t.code)} /></td>
                                        <td className="p-4 text-center text-slate-500 font-semibold">{i+1}</td>
                                        <td className="p-4 font-semibold text-slate-800 uppercase">{t.participant_name || '-'}</td>
                                        <td className="p-4 text-slate-600 font-medium">{t.participant_school || '-'}</td>
                                        <td className="p-4 font-mono font-bold text-indigo-600">{t.code}</td>
                                        <td className="p-4 text-center"><span className={`px-2.5 py-1 text-[10px] font-bold rounded uppercase tracking-wider ${t.status === 'AVAILABLE' ? 'bg-emerald-50 text-emerald-600 border border-emerald-100' : 'bg-rose-50 text-rose-600 border border-rose-100'}`}>{t.status}</span></td>
                                        <td className="p-4 text-center"><button onClick={()=>deleteToken(t.code)} className="text-rose-500 p-2 hover:bg-rose-100 rounded transition-colors" title="Hapus"><Trash2 size={16}/></button></td>
                                    </tr>
                                ))
                            )}
                            {(isMassEdit ? displayedMassEditTokens : displayedTokens).length === 0 && <tr><td colSpan={isMassEdit ? 6 : 7} className="text-center py-8 text-slate-500 italic bg-slate-50">Belum ada data peserta.</td></tr>}
                        </tbody>
                    </table>
                 </div>
               </AdminLayout>
             );
          };

          const AdminResults = () => {
             const [selectedAnalysis, setSelectedAnalysis] = useState(null);
             const [filterSchool, setFilterSchool] = useState('Semua');
             const [filterFolder, setFilterFolder] = useState('Semua');
             const [filterDate, setFilterDate] = useState('Semua');
             const [sortOrder, setSortOrder] = useState('DEFAULT');
             const [selectedResults, setSelectedResults] = useState([]);
             const [isDeleting, setIsDeleting] = useState(false);

             const getResultFolder = (r) => {
                 const firstQId = r.detail?.detailedResults?.find(x => x.qId !== 'SYS_CHEATS')?.qId;
                 if (!firstQId) return 'Utama';
                 const q = questions.find(x => x.id === firstQId);
                 return q ? (q.folder || 'Utama') : 'Utama';
             };

             const schoolList = ['Semua', ...new Set(results.map(r => r.participant?.school).filter(Boolean))];
             const folderList = ['Semua', ...new Set(results.map(getResultFolder))];
             const dateList = ['Semua', ...new Set(results.map(r => new Date(r.startTime).toLocaleDateString('id-ID')))];

             let processedResults = results.filter(r => {
                 const matchSchool = filterSchool === 'Semua' || r.participant?.school === filterSchool;
                 const matchFolder = filterFolder === 'Semua' || getResultFolder(r) === filterFolder;
                 const matchDate = filterDate === 'Semua' || new Date(r.startTime).toLocaleDateString('id-ID') === filterDate;
                 return matchSchool && matchFolder && matchDate;
             });

             if (sortOrder === 'NAME_ASC') processedResults.sort((a, b) => (a.participant?.name || '').localeCompare(b.participant?.name || ''));
             else if (sortOrder === 'NAME_DESC') processedResults.sort((a, b) => (b.participant?.name || '').localeCompare(a.participant?.name || ''));
             else if (sortOrder === 'RANK_DESC') processedResults.sort((a, b) => b.score - a.score);
             else if (sortOrder === 'RANK_ASC') processedResults.sort((a, b) => a.score - b.score);

             const handleSelectAll = (e) => {
                 if (e.target.checked) setSelectedResults(processedResults.map(r => r.id));
                 else setSelectedResults([]);
             };

             const handleSelectResult = (id) => {
                 if (selectedResults.includes(id)) setSelectedResults(selectedResults.filter(rid => rid !== id));
                 else setSelectedResults([...selectedResults, id]);
             };

             const deleteResult = async (id) => {
                 if(!confirm("Hapus hasil ujian peserta ini?")) return;
                 try { const db = await getSupabase(); await db.from('results').delete().eq('id', id); fetchSupabaseData(); } catch(e) { alert("Gagal menghapus: " + e.message); }
             };

             const handleDeleteSelected = async () => {
                 if (selectedResults.length === 0) return;
                 if (!confirm(`Hapus permanen ${selectedResults.length} data ujian terpilih?`)) return;
                 setIsDeleting(true);
                 try {
                     const db = await getSupabase();
                     const { error } = await db.from('results').delete().in('id', selectedResults);
                     if (error) throw error;
                     await fetchSupabaseData(); setSelectedResults([]); alert("Data terpilih berhasil dihapus.");
                 } catch (err) { alert("Gagal hapus masal: " + err.message); } finally { setIsDeleting(false); }
             };

             const downloadExcel = () => {
                 if (processedResults.length === 0) return alert("Tidak ada data untuk diunduh.");
                 let csvContent = "\uFEFFNo,Nama Peserta,Sekolah/Kelas,Folder Ujian,Skor Didapat,Total Maks Skor,Nilai Akhir (100),Waktu Mulai\n";
                 
                 processedResults.forEach((r, i) => {
                     const name = r.participant?.name ? r.participant.name.replace(/"/g, '""') : '';
                     const school = r.participant?.school ? r.participant.school.replace(/"/g, '""') : '';
                     const folderName = getResultFolder(r);
                     const details = Array.isArray(r.detail?.detailedResults) ? r.detail.detailedResults : [];
                     const earned = details.reduce((sum, d) => sum + (d.pointsEarned || 0), 0);
                     const maxP = details.reduce((sum, d) => sum + (d.questionMaxPoints || 0), 0);
                     const timeStr = new Date(r.startTime).toLocaleString('id-ID');
                     csvContent += `${i + 1},"${name}","${school}","${folderName}",${earned},${maxP},${r.score},"${timeStr}"\n`;
                 });
                 
                 const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                 const link = document.createElement("a"); link.href = URL.createObjectURL(blob);
                 link.download = `Hasil_Ujian_${filterSchool}_${filterFolder}_${new Date().getTime()}.csv`; link.click();
             };

             const downloadDetailPDF = () => {
                 if (!selectedAnalysis) return;
                 const printWindow = window.open('', '_blank');
                 const studentName = selectedAnalysis.participant?.name || 'Siswa';
                 
                 let rowsHTML = '';
                 
                 const studentDetails = Array.isArray(selectedAnalysis.detail?.detailedResults) ? selectedAnalysis.detail.detailedResults.filter(x => x.qId !== 'SYS_CHEATS') : [];
                 
                 studentDetails.forEach((d, index) => {
                     const q = questions.find(x => x.id === d.qId);
                     if (!q) return;

                     let ansDisplay = '<span style="color: #f59e0b; font-style: italic;">Tidak Menjawab</span>';
                     let keyDisplay = '';
                     
                     if (q.type === 'MCQ') {
                         const correctOpt = q.options?.find(o => o.id === q.correctAnswer);
                         keyDisplay = `<div style="margin-top:8px; padding:6px; background:#ecfdf5; border:1px solid #a7f3d0; border-radius:4px; font-size:11px; color:#065f46;"><strong>Kunci Jawaban: ${q.correctAnswer}</strong> - ${correctOpt?.text?.replace(/<[^>]+>/g, '') || q.correctAnswer}</div>`;
                         if (!d.isEmpty && d.userAnswer) {
                             const opt = q.options?.find(o => o.id === d.userAnswer);
                             ansDisplay = `<strong>${d.userAnswer}.</strong> ${opt?.text?.replace(/<[^>]+>/g, '') || d.userAnswer}`;
                         }
                     } else if (q.type === 'MCMA') {
                         const correctTexts = (q.correctAnswers||[]).map(ansId => {
                             const stmt = q.statements?.find(s => String(s.id) === String(ansId));
                             return `<li>${stmt?.text?.replace(/<[^>]+>/g, '') || ansId}</li>`;
                         }).join('');
                         keyDisplay = `<div style="margin-top:8px; padding:6px; background:#ecfdf5; border:1px solid #a7f3d0; border-radius:4px; font-size:11px; color:#065f46;"><strong>Kunci (Pilih Semua):</strong><ul style="margin:4px 0 0; padding-left:16px;">${correctTexts}</ul></div>`;
                         if (!d.isEmpty && Array.isArray(d.userAnswer)) {
                             const userTexts = d.userAnswer.map(ansId => {
                                 const stmt = q.statements?.find(s => String(s.id) === String(ansId));
                                 return `<li>${stmt?.text?.replace(/<[^>]+>/g, '') || ansId}</li>`;
                             }).join('');
                             ansDisplay = `<ul style="margin:0; padding-left:16px;">${userTexts}</ul>`;
                         }
                     } else if (q.type === 'CATEGORY') {
                         if (!d.isEmpty && d.userAnswer) {
                             const keys = Object.keys(d.userAnswer);
                             const listItems = keys.map(k => {
                                 const stmt = q.statements?.find(s => String(s.id) === String(k));
                                 const isCorrectLine = d.userAnswer[k] === stmt?.correctCategory;
                                 const badgeColor = isCorrectLine ? '#10b981' : '#f43f5e';
                                 return `<li style="margin-bottom:6px; padding:6px; border:1px solid #e2e8f0; background:#f8fafc; border-radius:4px; font-size:11px;">
                                     <div style="font-size:10px; color:#64748b; margin-bottom:4px;">Pernyataan: <span style="color:#333;">${stmt?.text?.replace(/<[^>]+>/g, '') || k}</span></div>
                                     <span style="background:${badgeColor}; color:white; padding:2px 4px; border-radius:3px; font-weight:bold;">${d.userAnswer[k]}</span>
                                     <span style="color:#94a3b8; font-size:10px; margin-left:4px;">(Kunci: ${stmt?.correctCategory})</span>
                                 </li>`;
                             }).join('');
                             ansDisplay = `<ul style="list-style:none; margin:0; padding:0;">${listItems}</ul>`;
                         }
                     }

                     const earned = d.pointsEarned !== undefined ? d.pointsEarned : (d.isCorrect ? (q.type === 'MCMA' ? 2 : 1) : 0);
                     const maxP = d.questionMaxPoints !== undefined ? d.questionMaxPoints : (q.type === 'MCMA' ? 2 : (q.type === 'CATEGORY' ? (q.statements||[]).length : 1));
                     
                     let badgeHtml = '';
                     if (d.isEmpty) badgeHtml = '<span style="background:#fef3c7; color:#d97706; padding:3px 6px; border-radius:4px; font-size:9px; font-weight:bold; text-transform:uppercase; border:1px solid #fde68a;">KOSONG</span>';
                     else if (earned === maxP) badgeHtml = '<span style="background:#d1fae5; color:#047857; padding:3px 6px; border-radius:4px; font-size:9px; font-weight:bold; text-transform:uppercase; border:1px solid #a7f3d0;">BENAR</span>';
                     else if (earned > 0) badgeHtml = '<span style="background:#fef3c7; color:#b45309; padding:3px 6px; border-radius:4px; font-size:9px; font-weight:bold; text-transform:uppercase; border:1px solid #fde68a;">SEBAGIAN</span>';
                     else badgeHtml = '<span style="background:#ffe4e6; color:#e11d48; padding:3px 6px; border-radius:4px; font-size:9px; font-weight:bold; text-transform:uppercase; border:1px solid #fecdd3;">SALAH</span>';

                     rowsHTML += `
                         <tr>
                             <td style="text-align:center; font-weight:bold; color:#94a3b8;">${index + 1}</td>
                             <td><div style="font-size:13px; color:#1e293b; line-height:1.5;">${q.question}</div>${keyDisplay}</td>
                             <td style="font-size:13px; color:#334155;">${ansDisplay}</td>
                             <td style="text-align:center;">
                                 <div style="font-size:16px; font-weight:900; color:#0f172a;">${earned} <span style="font-size:10px; color:#94a3b8; font-weight:normal;">/ ${maxP}</span></div>
                                 <div style="margin-top:6px;">${badgeHtml}</div>
                             </td>
                         </tr>
                     `;
                 });

                 const htmlContent = `
                     <!DOCTYPE html>
                     <html>
                     <head>
                         <title>Detail_Jawaban_${studentName.replace(/\s+/g, '_')}</title>
                         <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
                         <style>
                             body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 20px; color:#333; }
                             .header { text-align: center; border-bottom: 2px solid #1e293b; padding-bottom: 15px; margin-bottom: 25px; }
                             .header h2 { margin: 0; color: #0f172a; text-transform: uppercase; font-size: 22px; letter-spacing:1px; }
                             .header p { margin: 8px 0 0; color: #64748b; font-size: 14px; }
                             table { width: 100%; border-collapse: collapse; }
                             th, td { border: 1px solid #cbd5e1; padding: 12px; vertical-align: top; }
                             th { background-color: #f8fafc; color: #475569; font-size: 12px; text-transform: uppercase; letter-spacing:0.5px; }
                             img { max-width: 100%; height: auto; max-height: 200px; border-radius: 4px; display: block; margin: 8px 0; }
                             @media print { 
                                 @page { margin: 1cm; }
                                 body { padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                             }
                         </style>
                     </head>
                     <body>
                         <div class="header">
                             <h2>Laporan Detail Jawaban Siswa</h2>
                             <p>Nama Peserta: <strong style="color:#0f172a;">${studentName}</strong> &nbsp;|&nbsp; Asal Sekolah: <strong style="color:#0f172a;">${selectedAnalysis.participant?.school || '-'}</strong> &nbsp;|&nbsp; Nilai Akhir: <strong style="color:#059669; font-size:16px;">${selectedAnalysis.score}</strong></p>
                         </div>
                         <table>
                             <thead>
                                 <tr>
                                     <th style="width:5%;">No</th>
                                     <th style="width:45%; text-align:left;">Pertanyaan & Kunci Asli</th>
                                     <th style="width:35%; text-align:left;">Pilihan Siswa</th>
                                     <th style="width:15%;">Skor</th>
                                 </tr>
                             </thead>
                             <tbody>${rowsHTML}</tbody>
                         </table>
                         <script>
                             window.onload = function() { setTimeout(function() { window.print(); window.close(); }, 800); }
                         <${'/'}script>
                     </body>
                     </html>
                 `;
                 printWindow.document.open();
                 printWindow.document.write(htmlContent);
                 printWindow.document.close();
             };

             return (
               <AdminLayout title="Manajemen Hasil Ujian">
                 <div className="mb-6 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 bg-white p-4 rounded-xl border shadow-sm">
                     <div className="flex flex-wrap items-center gap-2 w-full xl:w-auto">
                         <div className="flex flex-wrap items-center gap-2 bg-slate-50 border border-slate-200 p-1.5 rounded-lg w-full sm:w-auto">
                             <select value={filterSchool} onChange={e=>{setFilterSchool(e.target.value); setSelectedResults([]);}} className="border-none py-1 px-2 text-sm bg-transparent font-semibold outline-none cursor-pointer text-slate-700">
                                 {schoolList.map(s => <option key={s} value={s}>{s === 'Semua' ? 'Sekolah: Semua' : s}</option>)}
                             </select>
                             <div className="w-px h-5 bg-slate-300 hidden sm:block"></div>
                             <select value={filterFolder} onChange={e=>{setFilterFolder(e.target.value); setSelectedResults([]);}} className="border-none py-1 px-2 text-sm bg-transparent font-semibold outline-none cursor-pointer text-blue-700">
                                 {folderList.map(f => <option key={f} value={f}>{f === 'Semua' ? 'Folder: Semua' : f}</option>)}
                             </select>
                             <div className="w-px h-5 bg-slate-300 hidden sm:block"></div>
                             <select value={filterDate} onChange={e=>{setFilterDate(e.target.value); setSelectedResults([]);}} className="border-none py-1 px-2 text-sm bg-transparent font-semibold outline-none cursor-pointer text-emerald-700">
                                 {dateList.map(d => <option key={d} value={d}>{d === 'Semua' ? 'Tanggal: Semua' : d}</option>)}
                             </select>
                         </div>
                         <select value={sortOrder} onChange={e=>setSortOrder(e.target.value)} className="border border-slate-300 rounded-lg p-2 text-sm bg-white font-semibold outline-none cursor-pointer">
                             <option value="DEFAULT">Urutan Terbaru</option><option value="NAME_ASC">Nama A-Z</option><option value="NAME_DESC">Nama Z-A</option><option value="RANK_DESC">Ranking Tertinggi</option><option value="RANK_ASC">Ranking Terendah</option>
                         </select>
                         
                         {selectedResults.length > 0 && (
                             <button onClick={handleDeleteSelected} disabled={isDeleting} className="bg-rose-50 text-rose-700 border border-rose-200 px-4 py-2 rounded-lg text-sm font-bold flex items-center hover:bg-rose-100 transition-colors shadow-sm">
                                 <Trash2 size={16} className="mr-2"/> Hapus ({selectedResults.length})
                             </button>
                         )}
                     </div>
                     <div className="flex gap-2 w-full xl:w-auto">
                         <button onClick={downloadExcel} className="flex-1 sm:flex-none bg-emerald-50 text-emerald-700 border border-emerald-200 px-4 py-2.5 rounded-lg text-sm font-bold flex items-center justify-center hover:bg-emerald-100 transition-colors shadow-sm"><i className="fas fa-file-excel mr-2"></i> Unduh Excel</button>
                         <button onClick={fetchSupabaseData} className="flex-1 sm:flex-none bg-blue-50 text-blue-600 border border-blue-200 px-4 py-2.5 rounded-lg text-sm font-bold flex items-center justify-center hover:bg-blue-100 transition-colors shadow-sm" title="Refresh"><i className="fas fa-sync-alt"></i></button>
                     </div>
                 </div>

                 {selectedAnalysis && (
                    <div className="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-xl shadow-xl w-full max-w-5xl max-h-[90vh] flex flex-col">
                            <div className="bg-slate-50 border-b px-5 py-4 flex justify-between items-center">
                                <h3 className="font-bold text-slate-800">Detail Jawaban: {selectedAnalysis.participant?.name}</h3>
                                <div className="flex items-center gap-3">
                                    <button onClick={downloadDetailPDF} className="text-xs bg-emerald-100 text-emerald-700 border border-emerald-300 hover:bg-emerald-200 px-3 py-1.5 rounded-md font-bold flex items-center transition-colors shadow-sm">
                                        <i className="fas fa-file-pdf mr-1.5"></i> Download PDF
                                    </button>
                                    <button onClick={() => setSelectedAnalysis(null)} className="text-slate-400 hover:text-slate-800 transition-colors"><X size={20}/></button>
                                </div>
                            </div>
                            <div className="p-0 overflow-y-auto flex-1">
                                <table className="w-full text-left text-sm border-collapse">
                                    <thead className="bg-slate-100 border-b sticky top-0 shadow-sm z-10">
                                        <tr><th className="p-4 w-12 text-center text-slate-600">No</th><th className="p-4 text-slate-600">Pertanyaan & Kunci Asli</th><th className="p-4 w-64 text-slate-600 border-l border-r border-slate-200 bg-blue-50/30">Pilihan Siswa</th><th className="p-4 w-28 text-center text-slate-600">Skor</th></tr>
                                    </thead>
                                    <tbody>
                                        {(Array.isArray(selectedAnalysis.detail?.detailedResults) ? selectedAnalysis.detail.detailedResults.filter(x => x.qId !== 'SYS_CHEATS') : []).map((d, index) => {
                                            const q = questions.find(x => x.id === d.qId);
                                            if (!q) return null;

                                            let ansDisplay = <span className="text-amber-500 italic font-semibold">Tidak Menjawab</span>;
                                            let keyDisplay = null;
                                            
                                            if (q.type === 'MCQ') {
                                                const correctOpt = q.options?.find(o => o.id === q.correctAnswer);
                                                const tmpK = document.createElement("div"); tmpK.innerHTML = correctOpt?.text || q.correctAnswer;
                                                keyDisplay = <div className="mt-3 p-2 bg-emerald-50 rounded border border-emerald-100 text-xs text-slate-700 font-medium"><strong className="text-emerald-700">Kunci Jawaban: {q.correctAnswer}</strong> - {tmpK.textContent}</div>;
                                                if (!d.isEmpty && d.userAnswer) {
                                                    const opt = q.options?.find(o => o.id === d.userAnswer);
                                                    const tmp = document.createElement("div"); tmp.innerHTML = opt?.text || d.userAnswer;
                                                    ansDisplay = <div className="font-medium text-slate-800"><strong className="text-blue-600">{d.userAnswer}.</strong> {tmp.textContent}</div>;
                                                }
                                            } else if (q.type === 'MCMA') {
                                                const correctTexts = (q.correctAnswers||[]).map(ansId => {
                                                    const stmt = q.statements?.find(s => String(s.id) === String(ansId));
                                                    const t = document.createElement("div"); t.innerHTML = stmt?.text || ansId; return t.textContent;
                                                });
                                                keyDisplay = <div className="mt-3 p-2 bg-emerald-50 rounded border border-emerald-100 text-xs text-slate-700 font-medium"><strong className="text-emerald-700 block mb-1">Kunci (Pilih Semua):</strong> <ul className="list-disc pl-4">{correctTexts.map((txt, ii)=><li key={ii}>{txt}</li>)}</ul></div>;
                                                if (!d.isEmpty && Array.isArray(d.userAnswer)) {
                                                    ansDisplay = <ul className="list-disc pl-4 space-y-1">{d.userAnswer.map(ansId => {
                                                        const stmt = q.statements?.find(s => String(s.id) === String(ansId)); const tmp = document.createElement("div"); tmp.innerHTML = stmt?.text || ansId;
                                                        return <li key={ansId} className="text-xs font-medium text-slate-700">{tmp.textContent}</li>;
                                                    })}</ul>;
                                                }
                                            } else if (q.type === 'CATEGORY') {
                                                if (!d.isEmpty && d.userAnswer) {
                                                    const keys = Object.keys(d.userAnswer);
                                                    ansDisplay = <ul className="space-y-2">{keys.map(k => {
                                                        const stmt = q.statements?.find(s => String(s.id) === String(k)); const tmp = document.createElement("div"); tmp.innerHTML = stmt?.text || k;
                                                        const isCorrectLine = d.userAnswer[k] === stmt?.correctCategory;
                                                        return <li key={k} className="text-xs text-slate-600 bg-slate-50 p-2 rounded border leading-snug"><div className="mb-1 text-[10px] font-bold text-slate-400">Pernyataan: <span className="text-slate-700 font-medium">{tmp.textContent}</span></div> <span className={`font-bold px-1.5 py-0.5 rounded text-white ${isCorrectLine ? 'bg-emerald-500' : 'bg-rose-500'}`}>{d.userAnswer[k]}</span> <span className="text-slate-400 ml-1">(Kunci: {stmt?.correctCategory})</span></li>;
                                                    })}</ul>;
                                                }
                                            }

                                            const earned = d.pointsEarned !== undefined ? d.pointsEarned : (d.isCorrect ? (q.type === 'MCMA' ? 2 : 1) : 0);
                                            const maxP = d.questionMaxPoints !== undefined ? d.questionMaxPoints : (q.type === 'MCMA' ? 2 : (q.type === 'CATEGORY' ? (q.statements||[]).length : 1));

                                            return (
                                                <tr key={q.id} className="border-b border-slate-100 hover:bg-slate-50">
                                                    <td className="p-4 text-center font-bold text-slate-400 align-top">{index + 1}</td>
                                                    <td className="p-4 align-top"><div className="line-clamp-4 text-slate-800 text-sm font-medium" dangerouslySetInnerHTML={{__html: q.question}} />{keyDisplay}</td>
                                                    <td className="p-4 align-top border-l border-r border-slate-100 bg-blue-50/10">{ansDisplay}</td>
                                                    <td className="p-4 text-center align-top">
                                                        {d.isEmpty ? <span className="text-amber-500 font-bold text-xs bg-amber-50 px-2 py-1 rounded border border-amber-200">KOSONG</span> : 
                                                            <div className="flex flex-col items-center">
                                                                <span className="font-black text-slate-800 text-lg">{earned} <span className="text-slate-400 font-medium text-xs">/ {maxP}</span></span>
                                                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded mt-1 uppercase tracking-wider ${earned === maxP ? 'bg-emerald-100 text-emerald-700' : (earned > 0 ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700')}`}>{earned === maxP ? 'BENAR' : (earned > 0 ? 'SEBAGIAN' : 'SALAH')}</span>
                                                            </div>
                                                        }
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                 )}
                 
                 <div className="bg-white rounded-xl border overflow-x-auto shadow-sm">
                    <table className="w-full text-left text-sm">
                        <thead className="bg-slate-50 border-b">
                            <tr>
                                <th className="p-4 text-center w-12"><input type="checkbox" className="w-4 h-4 cursor-pointer accent-blue-600 rounded" onChange={handleSelectAll} checked={selectedResults.length > 0 && selectedResults.length === processedResults.length} /></th>
                                <th className="p-4 w-12 text-center">No</th>
                                <th className="p-4">Nama Peserta</th>
                                <th className="p-4">Sekolah/Kelas</th>
                                <th className="p-4">Tipe Soal</th>
                                <th className="p-4 text-center" title="Skor Poin yang didapat">Skor</th>
                                <th className="p-4 text-center" title="Nilai Skala 100">Nilai</th>
                                <th className="p-4 text-center">Analisis</th>
                            </tr>
                        </thead>
                        <tbody>
                            {processedResults.map((r, idx)=> {
                                const details = Array.isArray(r.detail?.detailedResults) ? r.detail.detailedResults : [];
                                const earned = details.reduce((sum, d) => sum + (d.pointsEarned || 0), 0);
                                const maxP = details.reduce((sum, d) => sum + (d.questionMaxPoints || 0), 0);
                                const folderName = getResultFolder(r);
                                return (
                                <tr key={r.id} className={`border-b transition-colors ${selectedResults.includes(r.id) ? 'bg-blue-50/40' : 'hover:bg-slate-50'}`}>
                                    <td className="p-4 text-center"><input type="checkbox" className="w-4 h-4 cursor-pointer accent-blue-600 rounded" checked={selectedResults.includes(r.id)} onChange={() => handleSelectResult(r.id)} /></td>
                                    <td className="p-4 text-center font-semibold text-slate-500">{idx + 1}</td>
                                    <td className="p-4 font-bold text-slate-800 uppercase">{r.participant?.name}</td>
                                    <td className="p-4 font-medium text-slate-600">{r.participant?.school}</td>
                                    <td className="p-4 font-semibold text-blue-600">{folderName}</td>
                                    <td className="p-4 text-center"><div className="font-bold text-slate-700">{earned} <span className="text-xs text-slate-400 font-normal">/ {maxP}</span></div></td>
                                    <td className="p-4 text-center font-black text-emerald-600 text-lg">{r.score}</td>
                                    <td className="p-4 text-center"><button onClick={() => setSelectedAnalysis(r)} className="text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-100 transition-colors shadow-sm">Lihat Detail</button></td>
                                </tr>
                            )})}
                            {processedResults.length === 0 && <tr><td colSpan="8" className="text-center p-8 text-slate-500 font-bold bg-slate-50">Belum ada data hasil ujian yang masuk.</td></tr>}
                        </tbody>
                    </table>
                 </div>
               </AdminLayout>
             );
          };

          const AdminQuestions = () => {
            const [isSaving, setIsSaving] = useState(false);
            const [view, setViewLocal] = useState(window.savedAdminView || 'folders'); 
            const [filterFolder, setFilterFolderLocal] = useState(window.savedAdminFolder || 'Utama');
            const setView = (v) => { window.savedAdminView = v; setViewLocal(v); };
            const setFilterFolder = (f) => { window.savedAdminFolder = f; setFilterFolderLocal(f); };
            const [showImport, setShowImport] = useState(false);
            const [fileError, setFileError] = useState('');

            const defaultMCQ = { id: '', type: 'MCQ', folder: filterFolder, points: 1, question: '', options: [{id:'A', text:''}, {id:'B', text:''}, {id:'C', text:''}, {id:'D', text:''}], correctAnswer: 'A' };
            const defaultMCMA = { id: '', type: 'MCMA', folder: filterFolder, points: 2, question: '', statements: [{id:1, text:''}, {id:2, text:''}], correctAnswers: [] };
            const defaultCAT = { id: '', type: 'CATEGORY', folder: filterFolder, points: 3, question: '', statements: [{id:1, text:'', category1:'Benar', category2:'Salah', correctCategory:'Benar'}, {id:2, text:'', category1:'Benar', category2:'Salah', correctCategory:'Benar'}, {id:3, text:'', category1:'Benar', category2:'Salah', correctCategory:'Benar'}] };
            
            const [formData, setFormData] = useState(defaultMCQ);

            const downloadTemplateCSV = () => {
                const csvContent = "Mapel,Pertanyaan,Opsi A,Opsi B,Opsi C,Opsi D,Kunci\nBahasa Indonesia,Ibu kota Indonesia adalah?,Jakarta,Bandung,Surabaya,Medan,A\n";
                const link = document.createElement("a");
                link.setAttribute("href", URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' })));
                link.setAttribute("download", "Template_Bank_Soal.csv");
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            const downloadTemplateJSON = () => {
                const jsonTemplate = [
                    {
                        "type": "MCQ",
                        "points": 1,
                        "question": "Siapa penemu lampu pijar?",
                        "options": [
                            {"id": "A", "text": "Thomas Edison"},
                            {"id": "B", "text": "Albert Einstein"},
                            {"id": "C", "text": "Nikola Tesla"},
                            {"id": "D", "text": "Isaac Newton"}
                        ],
                        "correctAnswer": "A"
                    },
                    {
                        "type": "MCMA",
                        "points": 2,
                        "question": "Pilih dua hewan mamalia:",
                        "statements": [
                            {"id": 1, "text": "Kucing"},
                            {"id": 2, "text": "Ayam"},
                            {"id": 3, "text": "Sapi"},
                            {"id": 4, "text": "Ular"}
                        ],
                        "correctAnswers": [1, 3]
                    },
                    {
                        "type": "CATEGORY",
                        "points": 3,
                        "question": "Tentukan Benar atau Salah pernyataan di bawah ini:",
                        "statements": [
                            {"id": 1, "text": "Ibukota Jawa Tengah adalah Semarang", "category1": "Benar", "category2": "Salah", "correctCategory": "Benar"},
                            {"id": 2, "text": "Ikan bernapas dengan paru-paru", "category1": "Benar", "category2": "Salah", "correctCategory": "Salah"}
                        ]
                    }
                ];
                const link = document.createElement("a");
                link.setAttribute("href", URL.createObjectURL(new Blob([JSON.stringify(jsonTemplate, null, 4)], { type: 'application/json;charset=utf-8;' })));
                link.setAttribute("download", "Template_Bank_Soal_Lengkap.json");
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            const handleUploadSoal = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setFileError('');
                
                const reader = new FileReader();
                reader.onload = async (event) => {
                    const fileContent = event.target.result;
                    let payloads = [];

                    try {
                        if (file.name.toLowerCase().endsWith('.json')) {
                            const parsedData = JSON.parse(fileContent);
                            if (!Array.isArray(parsedData)) throw new Error("Format salah: File JSON harus berwujud Array '[ { ... } ]'.");
                            
                            payloads = parsedData.map((q, i) => {
                                if (!['MCQ', 'MCMA', 'CATEGORY'].includes(q.type)) throw new Error(`Tipe soal '${q.type}' pada item ke-${i+1} tidak valid.`);
                                return {
                                    id: `q${Date.now()}_${i}`,
                                    type: q.type, 
                                    folder: filterFolder,
                                    points: parseInt(q.points) || (q.type === 'MCQ' ? 1 : q.type === 'MCMA' ? 2 : 3),
                                    question: q.question || 'Tanpa Pertanyaan',
                                    options: q.options || null,
                                    correctAnswer: q.correctAnswer || null,
                                    statements: q.statements || null,
                                    correctAnswers: q.correctAnswers || null
                                };
                            });
                        } else if (file.name.toLowerCase().endsWith('.csv')) {
                            const lines = fileContent.split('\n').filter(l => l.trim() !== '');
                            for (let i = (lines[0].toLowerCase().includes('mapel') ? 1 : 0); i < lines.length; i++) {
                                const cols = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
                                const cleanCol = (col) => col ? col.replace(/(^"|"$)/g, '').replace(/""/g, '"').trim() : '';
                                
                                if (cols.length >= 7) {
                                    payloads.push({
                                        id: `q${Date.now()}_${i}`,
                                        type: 'MCQ', 
                                        folder: filterFolder,
                                        points: 1,
                                        question: cleanCol(cols[1]),
                                        options: [
                                            { id: 'A', text: cleanCol(cols[2]) },
                                            { id: 'B', text: cleanCol(cols[3]) },
                                            { id: 'C', text: cleanCol(cols[4]) },
                                            { id: 'D', text: cleanCol(cols[5]) }
                                        ],
                                        correctAnswer: cleanCol(cols[6]).toUpperCase()
                                    });
                                }
                            }
                        } else {
                            throw new Error("Sistem hanya menerima file .csv atau .json");
                        }

                        if (payloads.length === 0) throw new Error("Data soal kosong atau format tidak sesuai template.");

                        setIsSaving(true);
                        const db = await getSupabase();
                        const { error } = await db.from('questions').insert(payloads);
                        if (error) throw error;
                        
                        setShowImport(false); 
                        fetchSupabaseData(); 
                        alert(`Berhasil mengimpor ${payloads.length} soal!`);
                        
                    } catch(err) { 
                        setFileError(err.message); 
                    } finally { 
                        setIsSaving(false); 
                        e.target.value = null; 
                    }
                };
                reader.readAsText(file);
            };
              
            const saveQuestion = async (e) => {
               e.preventDefault();
               setIsSaving(true);
               try {
                 const db = await getSupabase();
                 
                 let payload = { 
                    id: formData.id || `q${Date.now()}`,
                    type: formData.type,
                    folder: formData.folder || filterFolder,
                    points: formData.points,
                    question: formData.question
                 };

                 if (formData.type === 'MCQ') {
                     payload.options = formData.options;
                     payload.correctAnswer = formData.correctAnswer;
                 } else if (formData.type === 'MCMA') {
                     payload.statements = formData.statements;
                     payload.correctAnswers = formData.correctAnswers;
                 } else if (formData.type === 'CATEGORY') {
                     payload.statements = formData.statements;
                 }

                 if(!formData.id) { 
                    const { error } = await db.from('questions').insert([payload]);
                    if (error) throw error;
                 } else { 
                    const { error } = await db.from('questions').update(payload).eq('id', payload.id);
                    if (error) throw error;
                 }
                 
                 setFilterFolder(payload.folder);
                 setView('list');
                 
                 await fetchSupabaseData(); 
                 alert("Soal berhasil disimpan!");
                 
               } catch (err) { 
                 alert("GAGAL MENYIMPAN KE DATABASE!\n" + err.message); 
               } finally { 
                 setIsSaving(false); 
               }
            };

            const deleteQuestion = async (id) => {
                if(!confirm("Hapus soal ini?")) return;
                try { 
                    const db = await getSupabase(); 
                    const { error } = await db.from('questions').delete().eq('id', id); 
                    if (error) throw error;
                    
                    setView('list');
                    await fetchSupabaseData(); 
                } catch(e) { alert("Gagal menghapus dari database: " + e.message); }
            };

            const duplicateQuestion = async (q) => {
                if(!confirm("Duplikasi soal ini?")) return;
                setIsSaving(true);
                try {
                    const db = await getSupabase();
                    const duplicatedQ = { ...q, id: `q${Date.now()}_copy` };
                    const { error } = await db.from('questions').insert([duplicatedQ]);
                    if (error) throw error;
                    
                    setFilterFolder(q.folder || filterFolder);
                    setView('list');
                    await fetchSupabaseData(); 
                } catch(e) { 
                    alert("Gagal menduplikasi: " + e.message); 
                }
                setIsSaving(false);
            };

            const publishFolder = async (fname) => {
                try {
                    const db = await getSupabase();
                    const { data, error: checkErr } = await db.from('tokens').select('code').eq('code', 'SYS_SETTING_FOLDER').maybeSingle();
                    if (checkErr && checkErr.code !== 'PGRST116') throw checkErr;
                    
                    if (data) {
                        const { error } = await db.from('tokens').update({ status: fname }).eq('code', 'SYS_SETTING_FOLDER');
                        if (error) throw error;
                    } else {
                        const { error } = await db.from('tokens').insert([{ code: 'SYS_SETTING_FOLDER', status: fname, generatedAt: new Date().toISOString() }]);
                        if (error) throw error;
                    }
                    setActiveFolder(fname);
                    alert(`Folder "${fname}" berhasil diterbitkan ke peserta!`);
                } catch(e) { alert("Gagal terbit: " + e.message); }
            };

            const folderStats = questions.reduce((acc, q) => { const f = q.folder || 'Utama'; acc[f] = (acc[f] || 0) + 1; return acc; }, {});
            tokens.forEach(t => { if (t.code && t.code.startsWith('SYS_FOLDER_') && folderStats[t.status] === undefined) { folderStats[t.status] = 0; } });
            if (folderStats['Utama'] === undefined) folderStats['Utama'] = 0;

            const createFolder = async () => {
                const fname = prompt("Masukkan Nama Folder Baru:\n(Contoh: Tryout 1, STS Ganjil)");
                if (fname && fname.trim() !== '') {
                    const folderName = fname.trim();
                    setIsSaving(true);
                    try {
                        const db = await getSupabase();
                        const { error } = await db.from('tokens').insert([{ code: `SYS_FOLDER_${Date.now()}`, status: folderName, generatedAt: new Date().toISOString(), participant_name: 'SYSTEM_FOLDER' }]);
                        if (error) throw error;
                        await fetchSupabaseData();
                        setFilterFolder(folderName); setView('list');
                        alert("Folder berhasil dibuat!");
                    } catch(e) { alert("Gagal menyimpan folder: " + e.message); }
                    setIsSaving(false);
                }
            };

            const editFolder = async (oldName) => {
                const newName = prompt(`Ubah nama folder "${oldName}" menjadi:`, oldName);
                if (newName && newName.trim() !== '' && newName.trim() !== oldName) {
                    setIsSaving(true);
                    try {
                        const db = await getSupabase();
                        const folderToken = tokens.find(t => t.code && t.code.startsWith('SYS_FOLDER_') && t.status === oldName);
                        if (folderToken) { 
                            const { error: err1 } = await db.from('tokens').update({ status: newName.trim() }).eq('code', folderToken.code); 
                            if (err1) throw err1;
                        }
                        const { error: err2 } = await db.from('questions').update({ folder: newName.trim() }).eq('folder', oldName);
                        if (err2) throw err2;
                        
                        if (activeFolder === oldName) { 
                            const { error: err3 } = await db.from('tokens').update({ status: newName.trim() }).eq('code', 'SYS_SETTING_FOLDER'); 
                            if (err3) throw err3;
                            setActiveFolder(newName.trim()); 
                        }
                        await fetchSupabaseData(); setFilterFolder(newName.trim());
                        alert("Nama folder berhasil diubah di database!");
                    } catch(e) { alert("Gagal ubah folder: " + e.message); }
                    setIsSaving(false);
                }
            };

            const deleteFolder = async (fname) => {
                if (fname === 'Utama') { alert("Folder Utama tidak dapat dihapus."); return; }
                if (!confirm(`Hapus folder "${fname}" beserta seluruh soal di dalamnya secara permanen?`)) return;
                setIsSaving(true);
                try {
                    const db = await getSupabase();
                    const folderToken = tokens.find(t => t.code && t.code.startsWith('SYS_FOLDER_') && t.status === fname);
                    if (folderToken) { 
                        const { error: err1 } = await db.from('tokens').delete().eq('code', folderToken.code); 
                        if (err1) throw err1;
                    }
                    const { error: err2 } = await db.from('questions').delete().eq('folder', fname);
                    if (err2) throw err2;
                    
                    if (activeFolder === fname) { 
                        const { error: err3 } = await db.from('tokens').update({ status: 'Utama' }).eq('code', 'SYS_SETTING_FOLDER'); 
                        if (err3) throw err3;
                        setActiveFolder('Utama'); 
                    }
                    await fetchSupabaseData(); setFilterFolder('Utama'); setView('folders');
                    alert("Folder beserta isinya berhasil dihapus dari database!");
                } catch(e) { alert("Gagal hapus folder: " + e.message); }
                setIsSaving(false);
            };

            if (view === 'create' || view === 'edit') {
               const availableFolders = [...new Set([...questions.map(q => q.folder || 'Utama'), ...tokens.filter(t => t.code && t.code.startsWith('SYS_FOLDER_')).map(t => t.status), filterFolder, 'Utama'])];
               return (
                 <AdminLayout title="Editor Soal">
                    <div className="bg-white rounded-xl shadow-sm border max-w-4xl mx-auto p-6 mb-10">
                        <form onSubmit={saveQuestion} className="space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-50 p-4 rounded-xl border">
                                <div>
                                    <label className="block text-sm font-semibold mb-1 text-slate-700">Tipe Soal</label>
                                    <select value={formData.type} onChange={e => {
                                        const t = e.target.value;
                                        if(t === 'MCQ') setFormData({...defaultMCQ, folder: formData.folder, points: 1, question: formData.question});
                                        else if(t === 'MCMA') setFormData({...defaultMCMA, folder: formData.folder, points: 2, question: formData.question});
                                        else if(t === 'CATEGORY') setFormData({...defaultCAT, folder: formData.folder, points: 3, question: formData.question});
                                    }} className="w-full p-2.5 border rounded-lg bg-white text-sm font-medium focus:ring-2 focus:ring-blue-500">
                                        <option value="MCQ">Pilihan Ganda (A-D)</option>
                                        <option value="MCMA">Pilihan Ganda Kompleks (&gt; 1 Jawaban)</option>
                                        <option value="CATEGORY">Matriks Kategori (Benar/Salah)</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold mb-1 text-slate-700">Pilih Folder Ujian</label>
                                    <select value={formData.folder || filterFolder} onChange={e => setFormData({...formData, folder: e.target.value})} className="w-full p-2.5 border rounded-lg bg-white text-sm font-medium focus:ring-2 focus:ring-blue-500">
                                        {availableFolders.map(f => <option key={f} value={f}>{f}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold mb-1 text-slate-700">Bobot Nilai</label>
                                    <input type="number" min="1" value={formData.points} onChange={e => setFormData({...formData, points: parseInt(e.target.value)})} className="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500"/>
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-bold text-slate-800 mb-2">Pertanyaan Utama</label>
                                <RichTextEditor value={formData.question} onChange={val => setFormData({...formData, question: val})} />
                            </div>

                            {/* EDITOR UNTUK PILIHAN GANDA (MCQ) DENGAN RICH TEXT */}
                            {formData.type === 'MCQ' && (
                                <div className="space-y-4 pt-4 border-t">
                                    <h3 className="font-bold text-slate-800 mb-2">Opsi Jawaban (A-D)</h3>
                                    {formData.options.map((opt, idx) => (
                                        <div key={opt.id} className="flex gap-3 items-start">
                                            <span className="font-bold w-6 pt-3 text-lg text-slate-500">{opt.id}.</span>
                                            <div className="flex-1">
                                                <RichTextEditor minHeight="60px" value={opt.text} onChange={val => { const o = [...formData.options]; o[idx].text = val; setFormData({...formData, options: o}); }} />
                                            </div>
                                        </div>
                                    ))}
                                    <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-200 mt-4 flex items-center justify-between">
                                        <label className="font-bold text-emerald-800">Kunci Jawaban Benar:</label>
                                        <select value={formData.correctAnswer} onChange={e => setFormData({...formData, correctAnswer: e.target.value})} className="p-2 border-2 border-emerald-400 rounded-lg font-bold text-emerald-700 w-32 text-center bg-white"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
                                    </div>
                                </div>
                            )}

                            {/* EDITOR UNTUK GANDA KOMPLEKS (MCMA) */}
                            {formData.type === 'MCMA' && (
                                <div className="space-y-4 pt-4 border-t">
                                    <div className="flex justify-between items-center"><h3 className="font-bold text-slate-800">Pernyataan (Pilih Jawaban Benar)</h3></div>
                                    {formData.statements.map((stmt, idx) => (
                                        <div key={stmt.id} className="flex gap-3 items-start border p-3 rounded-xl bg-slate-50">
                                            <div className="pt-2">
                                                <input type="checkbox" checked={formData.correctAnswers.includes(stmt.id)} onChange={e => {
                                                    let ans = [...formData.correctAnswers];
                                                    if(e.target.checked) ans.push(stmt.id); else ans = ans.filter(x => x !== stmt.id);
                                                    setFormData({...formData, correctAnswers: ans});
                                                }} className="w-5 h-5 text-blue-600 rounded cursor-pointer"/>
                                            </div>
                                            <div className="flex-1">
                                                 <RichTextEditor minHeight="60px" value={stmt.text} onChange={val => { const s = [...formData.statements]; s[idx].text = val; setFormData({...formData, statements: s}); }} />
                                            </div>
                                            <button type="button" onClick={() => { const s = formData.statements.filter((_, i) => i !== idx); setFormData({...formData, statements: s}); }} className="text-rose-500 mt-2 p-2 hover:bg-rose-100 rounded-lg"><Trash2 size={18}/></button>
                                        </div>
                                    ))}
                                    <button type="button" onClick={() => setFormData({...formData, statements: [...formData.statements, {id: Date.now(), text:''}]})} className="text-blue-600 font-bold text-sm bg-blue-50 px-4 py-2 rounded-lg">+ Tambah Pernyataan</button>
                                </div>
                            )}

                            {/* EDITOR UNTUK MATRIKS KATEGORI */}
                            {formData.type === 'CATEGORY' && (
                                <div className="space-y-4 pt-4 border-t">
                                    <h3 className="font-bold text-slate-800">Matriks Kategori (Benar/Salah)</h3>
                                    <div className="flex gap-4 mb-4">
                                         <div className="flex-1"><label className="text-xs font-bold text-slate-500">Label Kategori 1</label><input type="text" value={formData.statements[0]?.category1 || 'Benar'} onChange={e => { const s = [...formData.statements]; s.forEach(x => x.category1 = e.target.value); setFormData({...formData, statements: s}); }} className="w-full p-2.5 border rounded-lg font-semibold"/></div>
                                         <div className="flex-1"><label className="text-xs font-bold text-slate-500">Label Kategori 2</label><input type="text" value={formData.statements[0]?.category2 || 'Salah'} onChange={e => { const s = [...formData.statements]; s.forEach(x => x.category2 = e.target.value); setFormData({...formData, statements: s}); }} className="w-full p-2.5 border rounded-lg font-semibold"/></div>
                                    </div>
                                    {formData.statements.map((stmt, idx) => (
                                        <div key={stmt.id} className="border p-4 rounded-xl bg-slate-50 space-y-3">
                                            <RichTextEditor minHeight="60px" value={stmt.text} onChange={val => { const s = [...formData.statements]; s[idx].text = val; setFormData({...formData, statements: s}); }} />
                                            <div className="flex justify-between items-center pt-2 border-t border-slate-200">
                                                <div className="flex gap-6">
                                                    <label className="flex items-center gap-2 cursor-pointer font-semibold text-emerald-700"><input type="radio" className="w-5 h-5 text-emerald-600" checked={stmt.correctCategory === stmt.category1} onChange={() => { const s = [...formData.statements]; s[idx].correctCategory = stmt.category1; setFormData({...formData, statements: s}); }}/> Kunci: {stmt.category1}</label>
                                                    <label className="flex items-center gap-2 cursor-pointer font-semibold text-amber-700"><input type="radio" className="w-5 h-5 text-amber-600" checked={stmt.correctCategory === stmt.category2} onChange={() => { const s = [...formData.statements]; s[idx].correctCategory = stmt.category2; setFormData({...formData, statements: s}); }}/> Kunci: {stmt.category2}</label>
                                                </div>
                                                <button type="button" onClick={() => { const s = formData.statements.filter((_, i) => i !== idx); setFormData({...formData, statements: s}); }} className="text-rose-500 p-2 hover:bg-rose-100 rounded-lg"><Trash2 size={18}/></button>
                                            </div>
                                        </div>
                                    ))}
                                    <button type="button" onClick={() => setFormData({...formData, statements: [...formData.statements, {id: Date.now(), text:'', category1: formData.statements[0]?.category1||'Benar', category2: formData.statements[0]?.category2||'Salah', correctCategory: formData.statements[0]?.category1||'Benar'}]})} className="text-blue-600 font-bold text-sm bg-blue-50 px-4 py-2 rounded-lg">+ Tambah Baris Matriks</button>
                                </div>
                            )}

                            <div className="flex justify-end gap-3 pt-6 border-t mt-6">
                                <button type="button" onClick={() => setView('list')} className="px-6 py-2.5 border rounded-lg font-semibold hover:bg-slate-50 text-slate-600">Batal</button>
                                <button type="submit" disabled={isSaving} className="px-8 py-2.5 bg-blue-600 text-white rounded-lg font-bold shadow-md hover:bg-blue-700 disabled:opacity-50">{isSaving ? 'Menyimpan...' : 'Simpan Soal'}</button>
                            </div>
                        </form>
                    </div>
                 </AdminLayout>
               );
            }

            if (view === 'list') {
              const folderQuestions = questions.filter(q => String(q.folder || 'Utama').trim().toLowerCase() === filterFolder.toLowerCase());
              return (
                <AdminLayout title={`Folder: ${filterFolder}`}>
                  <div className="mb-6 flex justify-between items-center gap-3 bg-white p-4 rounded-xl border shadow-sm">
                     <button onClick={() => setView('folders')} className="border px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center hover:bg-slate-50"><ChevronLeft size={16} className="mr-1"/> Kembali</button>
                     <button onClick={() => setShowImport(true)} className="bg-emerald-600 text-white px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center shadow-sm hover:bg-emerald-700"><Upload size={16} className="mr-2"/> Unggah Soal (CSV)</button>
                  </div>
                  {showImport && (
                     <div className="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-xl shadow-xl w-full max-w-lg p-5">
                            <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-slate-800">Impor Soal CSV / JSON</h3><button onClick={()=>setShowImport(false)} className="text-slate-500 hover:text-slate-800"><X size={18}/></button></div>
                            
                            <div className="grid grid-cols-2 gap-3 mb-4">
                                <button onClick={downloadTemplateCSV} className="bg-slate-50 border text-slate-700 px-4 py-2 rounded-lg text-xs font-semibold flex items-center justify-center hover:bg-slate-100 transition-colors"><FileText size={14} className="mr-2"/> Templat CSV (Khusus Pilihan Ganda)</button>
                                <button onClick={downloadTemplateJSON} className="bg-blue-50 border border-blue-100 text-blue-700 px-4 py-2 rounded-lg text-xs font-semibold flex items-center justify-center hover:bg-blue-100 transition-colors"><Database size={14} className="mr-2"/> Templat JSON (Semua Tipe Soal)</button>
                            </div>

                            <input type="file" accept=".csv,.json" onChange={handleUploadSoal} className="w-full p-4 border-2 border-dashed border-slate-300 rounded-xl text-sm font-medium text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
                            
                            {fileError && <div className="mt-3 p-3 bg-rose-50 text-rose-600 text-xs font-bold border border-rose-200 rounded-lg"><i className="fas fa-exclamation-triangle mr-1"></i> {fileError}</div>}
                        </div>
                     </div>
                  )}
                  <div className="space-y-4">
                    {folderQuestions.map((q, idx) => (
                       <div key={q.id} className="bg-white p-5 rounded-xl border shadow-sm flex flex-col sm:flex-row justify-between items-start gap-4">
                         <div className="flex-1">
                             <div className="flex items-center gap-2 mb-2">
                                 <span className="text-xs font-bold bg-blue-50 text-blue-700 px-2.5 py-1 rounded-md">No. {idx+1}</span>
                                 <span className="text-[10px] font-bold bg-slate-100 text-slate-500 px-2 py-1 rounded uppercase tracking-wider">{q.type}</span>
                             </div>
                             <div className="mt-2 text-slate-800 font-medium rich-text-content text-sm" dangerouslySetInnerHTML={{__html: q.question}}></div>
                         </div>
                         <div className="flex sm:flex-col gap-2 shrink-0">
                            <button onClick={() => duplicateQuestion(q)} className="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 p-2.5 rounded-xl font-bold text-xs flex items-center justify-center border border-emerald-200 flex-1 sm:flex-none transition-colors" title="Duplikasi Soal"><Copy size={16} className="sm:mr-1.5"/> <span className="hidden sm:inline">Duplikat</span></button>
                            <button onClick={() => {setFormData(q); setView('edit');}} className="text-blue-600 bg-blue-50 p-2 hover:bg-blue-100 rounded-lg flex items-center justify-center" title="Edit Soal"><Edit size={16}/></button>
                            <button onClick={() => deleteQuestion(q.id)} className="text-rose-600 bg-rose-50 p-2 hover:bg-rose-100 rounded-lg flex items-center justify-center" title="Hapus Soal"><Trash2 size={16}/></button>
                         </div>
                       </div>
                    ))}
                    {folderQuestions.length === 0 && <div className="text-center py-12 bg-white rounded-xl border border-dashed border-slate-300 text-slate-500 font-bold">Belum ada soal di folder ini.</div>}
                  </div>
                  <button onClick={() => {setFormData({...defaultMCQ, folder: filterFolder}); setView('create');}} className="fixed bottom-8 right-8 bg-blue-600 text-white w-16 h-16 rounded-full flex items-center justify-center shadow-xl hover:scale-105 transition-transform"><Plus size={28}/></button>
                </AdminLayout>
              );
            }

            return (
              <AdminLayout title="Manajemen Bank Soal">
                 <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                    <div onClick={createFolder} className="bg-emerald-50 border-2 border-dashed border-emerald-300 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer min-h-[180px] hover:bg-emerald-100 transition-colors">
                        <div className="w-12 h-12 bg-emerald-200 text-emerald-700 rounded-full flex items-center justify-center mb-3"><Plus size={24}/></div>
                        <span className="font-bold text-emerald-800">Buat Folder Baru</span>
                    </div>
                    {Object.entries(folderStats).map(([fname, count]) => {
                        const isPublished = activeFolder.toLowerCase() === fname.toLowerCase();
                        return (
                        <div key={fname} className={`bg-white border-2 rounded-2xl p-6 flex flex-col justify-between shadow-sm min-h-[180px] ${isPublished ? 'border-emerald-400' : 'border-slate-200'}`}>
                            <div>
                                <h4 className="font-bold text-xl text-slate-800 mb-1 truncate" title={fname}>{fname}</h4>
                                <p className="text-xs text-slate-500 font-semibold bg-slate-100 inline-block px-3 py-1 rounded-full">{count} Butir Soal</p>
                            </div>
                            <div className="mt-6 flex flex-col gap-2">
                                <div className="flex gap-2">
                                    <button onClick={() => { setFilterFolder(fname); setView('list'); }} className="flex-1 bg-slate-100 py-2 rounded-lg text-sm font-bold text-slate-700 hover:bg-slate-200 transition-colors">Buka</button>
                                    <button onClick={() => editFolder(fname)} className="px-3 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition-colors" title="Edit Nama Folder"><Edit size={16}/></button>
                                    {fname !== 'Utama' && <button onClick={() => deleteFolder(fname)} className="px-3 bg-rose-50 text-rose-600 rounded-lg hover:bg-rose-100 transition-colors" title="Hapus Folder Permanen"><Trash2 size={16}/></button>}
                                </div>
                                <button onClick={() => publishFolder(fname)} className={`w-full py-2.5 rounded-lg text-sm font-bold transition-colors ${isPublished ? 'bg-emerald-600 text-white shadow-md' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>
                                    {isPublished ? 'Sedang Diterbitkan' : 'Terbitkan Folder Ini'}
                                </button>
                            </div>
                        </div>
                    )})}
                 </div>
              </AdminLayout>
            );
          };

          const AdminItemAnalysis = () => {
             const [isDeleting, setIsDeleting] = useState(false);
             const [filterFolder, setFilterFolder] = useState('Semua');
             const [filterSchool, setFilterSchool] = useState('Semua');
             const [filterDate, setFilterDate] = useState('Semua');
             const [activeTab, setActiveTab] = useState('BUTIR'); 
             const [sortOrder, setSortOrder] = useState('DEFAULT'); 

             const availableFolders = ['Semua', ...new Set(questions.map(q => q.folder || 'Utama'))];
             const schoolList = ['Semua', ...new Set(results.map(r => r.participant?.school).filter(Boolean))];
             const dateList = ['Semua', ...new Set(results.map(r => new Date(r.startTime).toLocaleDateString('id-ID')))];

             const filteredQuestions = filterFolder === 'Semua' ? questions : questions.filter(q => (q.folder || 'Utama') === filterFolder);
             
             const filteredResults = results.filter(r => {
                 const matchSchool = filterSchool === 'Semua' || r.participant?.school === filterSchool;
                 const matchDate = filterDate === 'Semua' || new Date(r.startTime).toLocaleDateString('id-ID') === filterDate;
                 return matchSchool && matchDate;
             });

             const deleteAllResults = async () => {
                if(results.length === 0) return;
                if(!confirm("PERINGATAN: Menghapus data di sini akan menghapus SELURUH hasil ujian siswa. Lanjutkan?")) return;
                setIsDeleting(true);
                try {
                    const db = await getSupabase();
                    const { error } = await db.from('results').delete().neq('participant_name', 'DELETE_ALL_DUMMY');
                    if (error) throw error;
                    await fetchSupabaseData();
                    alert("Seluruh data analisis dan hasil berhasil dihapus.");
                } catch(e) { alert("Gagal menghapus data: " + e.message); }
                setIsDeleting(false);
             };

            const analysisData = filteredQuestions.map(q => {
                let correct = 0, wrong = 0, empty = 0;
                filteredResults.forEach(r => {
                    const details = Array.isArray(r.detail?.detailedResults) ? r.detail.detailedResults : [];
                    const d = details.find(x => x.qId === q.id);
                    if (!d || d.isEmpty) empty++;
                    else if (d.isCorrect) correct++;
                    else wrong++;
                });
                const total = filteredResults.length;
                const percentage = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;
                
                let difficulty = "N/A";
                if (total > 0) {
                    const p = parseFloat(percentage);
                    if (p > 85) difficulty = "Sangat Mudah";
                    else if (p >= 70) difficulty = "Mudah";
                    else if (p >= 50) difficulty = "Sedang";
                    else if (p >= 30) difficulty = "Sulit";
                    else difficulty = "Sangat Sulit";
                }
                return { ...q, correct, wrong, empty, total, percentage, difficulty };
            });

            let matrixResults = filteredResults.filter(r => {
                 if (filterFolder === 'Semua') return true;
                 const firstQId = r.detail?.detailedResults?.find(x => x.qId !== 'SYS_CHEATS')?.qId;
                 const q = questions.find(x => x.id === firstQId);
                 return (q?.folder || 'Utama') === filterFolder;
            });

            if (sortOrder === 'NAME_ASC') matrixResults.sort((a,b) => (a.participant?.name || '').localeCompare(b.participant?.name || ''));
            else if (sortOrder === 'NAME_DESC') matrixResults.sort((a,b) => (b.participant?.name || '').localeCompare(a.participant?.name || ''));

            const downloadAnalisis = () => {
                if (analysisData.length === 0) return alert("Tidak ada data analisis untuk diunduh.");
                let csvContent = "\uFEFFNo,Folder/Kategori,Tipe,Pertanyaan,Benar,Salah,Kosong,Persentase Benar,Tingkat Kesulitan\n";
                
                analysisData.forEach((d, idx) => {
                    const tempDiv = document.createElement("div"); tempDiv.innerHTML = d.question || "";
                    const plainText = (tempDiv.textContent || tempDiv.innerText || "").replace(/"/g, '""').replace(/\n/g, ' ');
                    csvContent += `${idx + 1},"${d.folder || 'Utama'}","${d.type}","${plainText}",${d.correct},${d.wrong},${d.empty},"${d.percentage}%","${d.difficulty}"\n`;
                });
                
                const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }));
                link.download = `Analisis_Butir_Soal_${filterFolder}_${new Date().getTime()}.csv`; link.click();
            };

            const downloadMatrixPDF = () => {
                if (matrixResults.length === 0) return alert("Tidak ada data untuk dicetak.");
                
                const printWindow = window.open('', '_blank');
                
                let tableHeaders = `<th style="width: 30px;">No</th><th style="text-align: left;">Nama Peserta</th>`;
                filteredQuestions.forEach((q, i) => {
                    const tooltip = (q.question || '').replace(/<[^>]+>/g, '').replace(/"/g, "'");
                    tableHeaders += `<th title="${tooltip}" style="width: 25px;">${i + 1}</th>`;
                });
                tableHeaders += `<th style="width: 50px;">Skor</th><th style="width: 50px;">Nilai</th>`;

                let tableRows = '';
                matrixResults.forEach((r, i) => {
                    const details = Array.isArray(r.detail?.detailedResults) ? r.detail.detailedResults : [];
                    const earned = details.reduce((sum, d) => sum + (d.pointsEarned || 0), 0);

                    let rowHtml = `<tr>
                        <td style="text-align:center;">${i + 1}</td>
                        <td style="text-transform: uppercase; font-weight: bold; font-size: 10px;">${r.participant?.name || '-'}</td>`;

                    filteredQuestions.forEach(q => {
                        const d = details.find(x => x.qId === q.id);
                        let status = '-'; let bgColor = '#f8fafc'; let color = '#94a3b8';

                        if (d) {
                            if (d.isEmpty) { status = 'K'; bgColor = '#fef3c7'; color = '#d97706'; } // Kosong
                            else if (d.isCorrect) { status = 'B'; bgColor = '#d1fae5'; color = '#059669'; } // Benar
                            else if (d.pointsEarned > 0) { status = 'P'; bgColor = '#dbeafe'; color = '#2563eb'; } // Parsial
                            else { status = 'S'; bgColor = '#ffe4e6'; color = '#e11d48'; } // Salah
                        }
                        rowHtml += `<td style="text-align:center; background-color:${bgColor}; color:${color}; font-weight:bold;">${status}</td>`;
                    });

                    rowHtml += `<td style="text-align:center; font-weight:bold; background-color: #f1f5f9;">${earned}</td>
                                <td style="text-align:center; font-weight:900; color:#059669; background-color: #ecfdf5;">${r.score}</td>
                              </tr>`;
                    tableRows += rowHtml;
                });

                const htmlContent = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>Matriks_Analisis_${filterFolder.replace(/\s+/g, '_')}</title>
                        <style>
